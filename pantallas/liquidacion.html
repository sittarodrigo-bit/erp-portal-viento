<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquidación de Sueldos | Portal del Viento</title>
<script>window.PANEL_ACTUAL = "reportes";</script>
<script src="/static/auth.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{neon:'#d4ff3f'}}}}</script>
</head>
<body class="bg-gray-950 text-gray-200 font-sans min-h-screen">

  <header class="bg-black border-b border-gray-800 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
    <div class="flex items-center gap-3">
      <a href="/admin" class="text-gray-400 hover:text-white text-sm">← Panel</a>
      <h1 class="text-neon font-bold text-lg">👥 RRHH & Liquidación</h1>
    </div>
  </header>

  <main class="p-6 max-w-5xl mx-auto">

    <!-- Pestañas -->
    <div class="flex gap-1 mb-5 border-b border-gray-800 overflow-x-auto">
        <button onclick="cambiarTabLiq('liquidacion')" id="tab-liq" class="py-2 px-3 text-sm font-bold border-b-2 border-neon text-white whitespace-nowrap">💵 Liquidación</button>
        <button onclick="cambiarTabLiq('fichajes')"    id="tab-fich" class="py-2 px-3 text-sm font-bold text-gray-400 hover:text-white border-b-2 border-transparent whitespace-nowrap">🕐 Fichajes</button>
        <button onclick="cambiarTabLiq('anticipos')"   id="tab-ant" class="py-2 px-3 text-sm font-bold text-gray-400 hover:text-white border-b-2 border-transparent whitespace-nowrap">💸 Anticipos</button>
        <button onclick="cambiarTabLiq('planilla')"    id="tab-plan" class="py-2 px-3 text-sm font-bold text-gray-400 hover:text-white border-b-2 border-transparent whitespace-nowrap">📋 Planilla horaria</button>
        <button onclick="cambiarTabLiq('historial')"   id="tab-hist" class="py-2 px-3 text-sm font-bold text-gray-400 hover:text-white border-b-2 border-transparent whitespace-nowrap">🗂 Historial pagos</button>
        <button onclick="cambiarTabLiq('anual')"       id="tab-anual" class="py-2 px-3 text-sm font-bold text-gray-400 hover:text-white border-b-2 border-transparent whitespace-nowrap">📅 Historial anual</button>
    </div>

    <!-- PANEL LIQUIDACIÓN -->
    <div id="panel-liquidacion">
    <!-- Selector de fechas -->
    <div class="bg-black border border-gray-800 rounded-2xl p-5 mb-6">
      <div class="flex flex-wrap gap-4 items-end">
        <div>
          <label class="block text-xs text-gray-500 font-bold mb-1">Desde</label>
          <input type="date" id="fecha-desde" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2.5">
        </div>
        <div>
          <label class="block text-xs text-gray-500 font-bold mb-1">Hasta</label>
          <input type="date" id="fecha-hasta" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2.5">
        </div>
        <button onclick="cargar()" class="bg-neon text-black font-bold px-6 py-2.5 rounded-lg">Calcular</button>
        <!-- Toggle solo pendientes -->
        <label class="flex items-center gap-2 cursor-pointer ml-2 select-none" title="Ocultar los empleados ya pagados">
          <div onclick="toggleSoloPendientes()" id="toggle-pend-track"
            style="display:inline-flex;align-items:center;width:40px;height:22px;border-radius:11px;padding:2px;transition:background .2s;background:#d4ff3f">
            <div id="toggle-pend-thumb" style="width:18px;height:18px;border-radius:50%;background:#000;transition:transform .2s;transform:translateX(18px)"></div>
          </div>
          <span id="toggle-pend-label" class="text-xs text-gray-300 font-semibold">Solo pendientes</span>
        </label>
        <div class="flex gap-2 ml-auto">
          <button onclick="rangoRapido('semana')" class="text-xs border border-gray-700 text-gray-300 hover:text-white px-3 py-2 rounded-lg">Esta semana</button>
          <button onclick="rangoRapido('quincena')" class="text-xs border border-gray-700 text-gray-300 hover:text-white px-3 py-2 rounded-lg">Quincena</button>
          <button onclick="imprimirPlanilla()" class="text-xs bg-gray-800 border border-gray-700 text-white hover:border-gray-500 px-3 py-2 rounded-lg font-bold">🖨️ Planilla general</button>
        </div>
      </div>
    </div>

    <div id="contenido">
      <p class="text-gray-500 text-center py-16">Elegí un rango de fechas y tocá Calcular.</p>
    </div>
    </div><!-- fin panel-liquidacion -->

    <!-- PANEL PLANILLA HORARIA -->
    <div id="panel-planilla" class="hidden">
      <div class="bg-black border border-gray-800 rounded-2xl p-4 mb-5">
        <div class="flex flex-wrap gap-3 items-center">
          <select id="plan-empleado" onchange="cargarPlanilla()" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2.5 min-w-[200px]">
            <option value="">— Elegir empleado —</option>
          </select>
          <div class="flex items-center gap-2 ml-auto">
            <button onclick="planSemanaAnterior()" class="border border-gray-700 text-gray-300 hover:text-white px-3 py-2 rounded-lg text-sm font-bold">‹ Anterior</button>
            <span id="label-semana-plan" class="text-white font-bold text-sm min-w-[200px] text-center"></span>
            <button onclick="planSemanaSiguiente()" class="border border-gray-700 text-gray-300 hover:text-white px-3 py-2 rounded-lg text-sm font-bold">Siguiente ›</button>
          </div>
          <button onclick="copiarSemanaAnterior()" class="border border-gray-700 text-gray-400 hover:text-white px-4 py-2 rounded-lg text-sm">↩ Copiar semana ant.</button>
        </div>
      </div>
      <div id="tabla-planilla">
        <p class="text-gray-500 text-center py-10">Elegí un empleado para cargar su planilla.</p>
      </div>
    </div>

    <!-- PANEL HISTORIAL -->
    <div id="panel-historial" class="hidden">
        <div class="flex justify-between items-center mb-4">
            <p class="text-white font-bold">Historial de pagos de sueldos</p>
            <button onclick="cargarHistorial()" class="border border-gray-700 text-gray-400 hover:text-white px-3 py-1.5 rounded text-sm">🔄 Actualizar</button>
        </div>
        <div class="mb-3">
            <select id="hist-empleado" onchange="cargarHistorial()" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2 text-sm">
                <option value="">Todos los empleados</option>
            </select>
        </div>
        <div id="tabla-historial">
            <p class="text-gray-500 text-center py-8">Cargando historial...</p>
        </div>
    </div>

    <!-- PANEL FICHAJES -->
    <div id="panel-fichajes" class="hidden">
      <!-- Barra de control: empleado + navegación de semana -->
      <div class="bg-black border border-gray-800 rounded-2xl p-4 mb-5">
        <div class="flex flex-wrap gap-3 items-center">
          <select id="fich-empleado" onchange="cargarFichajesLiq()" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2.5 min-w-[200px]">
            <option value="">— Elegir empleado —</option>
          </select>
          <!-- Navegación semana -->
          <div class="flex items-center gap-2 ml-auto">
            <button onclick="semanaAnterior()" class="border border-gray-700 text-gray-300 hover:text-white px-3 py-2 rounded-lg text-sm font-bold">‹ Anterior</button>
            <span id="label-semana" class="text-white font-bold text-sm min-w-[200px] text-center"></span>
            <button onclick="semanaSiguiente()" class="border border-gray-700 text-gray-300 hover:text-white px-3 py-2 rounded-lg text-sm font-bold">Siguiente ›</button>
          </div>
          <button onclick="abrirModalFichajeNuevo()" class="border border-neon text-neon hover:bg-neon hover:text-black font-bold px-4 py-2 rounded-lg text-sm transition">+ Agregar</button>
        </div>
      </div>
      <!-- Tabla semanal -->
      <div id="tabla-fichajes-liq">
        <p class="text-gray-500 text-center py-10">Elegí un empleado para ver su semana.</p>
      </div>
    </div>

    <!-- PANEL ANTICIPOS -->
    <div id="panel-anticipos" class="hidden">
      <div class="bg-black border border-gray-800 rounded-2xl p-5 mb-5">
        <div class="flex flex-wrap gap-3 items-end">
          <div>
            <label class="block text-xs text-gray-500 font-bold mb-1">Empleado</label>
            <select id="ant-empleado-sel" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2.5 min-w-[200px]">
              <option value="">— Elegir empleado —</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-500 font-bold mb-1">Monto $</label>
            <input type="number" id="ant-monto" placeholder="0" min="0" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2.5 w-32">
          </div>
          <div>
            <label class="block text-xs text-gray-500 font-bold mb-1">Concepto</label>
            <input type="text" id="ant-obs" placeholder="Anticipo de quincena..." class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2.5 w-52">
          </div>
          <button onclick="registrarAnticipoLiq()" class="bg-neon text-black font-bold px-5 py-2.5 rounded-lg">💸 Registrar anticipo</button>
        </div>
      </div>
      <div class="flex gap-3 mb-4 items-end">
        <div>
          <label class="block text-xs text-gray-500 font-bold mb-1">Desde</label>
          <input type="date" id="ant-desde-fil" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
        </div>
        <div>
          <label class="block text-xs text-gray-500 font-bold mb-1">Hasta</label>
          <input type="date" id="ant-hasta-fil" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2">
        </div>
        <button onclick="cargarAnticiposLiq()" class="border border-gray-700 text-gray-300 hover:text-white px-4 py-2 rounded-lg text-sm">🔍 Filtrar</button>
      </div>
      <div id="tabla-anticipos-liq">
        <p class="text-gray-500 text-center py-10">Cargando anticipos...</p>
      </div>
    </div>

    <!-- PANEL HISTORIAL ANUAL -->
    <div id="panel-anual" class="hidden">
      <div class="bg-black border border-gray-800 rounded-2xl p-5 mb-5">
        <div class="flex flex-wrap gap-3 items-end">
          <div>
            <label class="block text-xs text-gray-500 font-bold mb-1">Empleado</label>
            <select id="anual-empleado" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2.5 min-w-[200px]">
              <option value="">— Elegir empleado —</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-500 font-bold mb-1">Año</label>
            <input type="number" id="anual-anio" value="" min="2020" max="2030" class="bg-gray-900 border border-gray-700 text-white rounded-lg p-2.5 w-28">
          </div>
          <button onclick="cargarHistAnual()" class="bg-neon text-black font-bold px-5 py-2.5 rounded-lg">📅 Ver historial</button>
        </div>
      </div>
      <div id="contenido-anual">
        <p class="text-gray-500 text-center py-10">Elegí un empleado y el año.</p>
      </div>
    </div>

    <!-- MODAL FICHAJE NUEVO/EDITAR -->
    <div id="modal-fichaje" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
      <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 w-[400px] shadow-2xl">
        <h3 class="text-white font-bold text-lg mb-4" id="modal-fich-titulo">Agregar fichaje</h3>
        <input type="hidden" id="mfich-id">
        <div class="space-y-3">
          <div>
            <label class="block text-xs text-gray-500 font-bold mb-1">Empleado</label>
            <select id="mfich-emp" class="w-full bg-black border border-gray-700 text-white rounded-lg p-2.5">
              <option value="">— Elegir —</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-gray-500 font-bold mb-1">Tipo</label>
              <select id="mfich-tipo" class="w-full bg-black border border-gray-700 text-white rounded-lg p-2.5">
                <option value="entrada">Entrada</option>
                <option value="salida">Salida</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-gray-500 font-bold mb-1">Fecha y hora</label>
              <input type="datetime-local" id="mfich-fecha" class="w-full bg-black border border-gray-700 text-white rounded-lg p-2.5">
            </div>
          </div>
          <div>
            <label class="block text-xs text-gray-500 font-bold mb-1">Observación</label>
            <input type="text" id="mfich-obs" placeholder="Opcional..." class="w-full bg-black border border-gray-700 text-white rounded-lg p-2.5">
          </div>
        </div>
        <div class="flex gap-3 mt-5">
          <button onclick="cerrarModalFichaje()" class="flex-1 border border-gray-700 text-gray-400 hover:text-white font-bold py-2.5 rounded-xl">Cancelar</button>
          <button onclick="guardarFichajeModal()" class="flex-1 bg-neon text-black font-bold py-2.5 rounded-xl">Guardar</button>
        </div>
      </div>
    </div>

  </main>

<script>
const API_URL = window.location.origin + "/api";
const $ = id => document.getElementById(id);
const fmt = n => '$' + (Math.round((parseFloat(n)||0))).toLocaleString('es-AR');
let datos = [];
// Estado local: días marcados como doble por empleado (clave: idEmp-dia)
let diasDobles = {};

function rangoRapido(tipo){
  const hoy = new Date();
  let desde = new Date(hoy);
  if(tipo === 'semana'){
    const dia = (hoy.getDay()+6)%7; // lunes=0
    desde.setDate(hoy.getDate()-dia);
  } else if(tipo === 'quincena'){
    desde.setDate(hoy.getDate()-14);
  }
  $('fecha-desde').value = desde.toISOString().split('T')[0];
  $('fecha-hasta').value = hoy.toISOString().split('T')[0];
  cargar();
}

async function cargar(){
  const desde = $('fecha-desde').value, hasta = $('fecha-hasta').value;
  if(!desde || !hasta){ alert('Elegí las dos fechas.'); return; }
  $('contenido').innerHTML = '<p class="text-gray-500 text-center py-16">Calculando...</p>';
  try{
    datos = await fetch(`${API_URL}/liquidacion/detalle?fecha_desde=${desde}&fecha_hasta=${hasta}`).then(r=>r.json());
    diasDobles = {};
    render();
  }catch(e){
    $('contenido').innerHTML = '<p class="text-red-400 text-center py-16">No se pudo calcular.</p>';
  }
}

let soloPendientes = true; // por defecto mostrar solo los que no están pagados

function toggleSoloPendientes() {
  soloPendientes = !soloPendientes;
  const track = document.getElementById('toggle-pend-track');
  const thumb = document.getElementById('toggle-pend-thumb');
  const label = document.getElementById('toggle-pend-label');
  if (soloPendientes) {
    track.style.background = '#d4ff3f';
    thumb.style.transform = 'translateX(18px)';
    thumb.style.background = '#000';
    label.textContent = 'Solo pendientes';
  } else {
    track.style.background = '#374151';
    thumb.style.transform = 'translateX(0)';
    thumb.style.background = '#fff';
    label.textContent = 'Ver todos';
  }
  render();
}

function render(){
  if(!datos.length){
    $('contenido').innerHTML = '<div class="text-center py-16 text-gray-500"><div class="text-5xl mb-3">📭</div>No hay fichajes en ese rango.</div>';
    return;
  }
  const filtrados = soloPendientes ? datos.filter(e => !e.ya_pagado) : datos;
  const pagados   = soloPendientes ? datos.filter(e =>  e.ya_pagado) : [];
  let html = filtrados.map(renderEmpleado).join('');
  if (soloPendientes && pagados.length) {
    html += `<div class="text-center py-4 text-gray-600 text-sm border border-dashed border-gray-800 rounded-xl">
      ${pagados.length} empleado${pagados.length!==1?'s':''} ya pagado${pagados.length!==1?'s':''} — ocultado${pagados.length!==1?'s':''}.
      <button onclick="toggleSoloPendientes()" class="ml-2 text-gray-400 underline hover:text-white">Mostrar todos</button>
    </div>`;
  }
  if (!filtrados.length && !pagados.length) {
    html = '<div class="text-center py-16 text-gray-500"><div class="text-5xl mb-3">📭</div>No hay fichajes en ese rango.</div>';
  } else if (!filtrados.length && pagados.length) {
    html = `<div class="text-center py-16 text-gray-500">
      <div class="text-5xl mb-3">✅</div>
      <p class="font-bold text-green-400">Todos los empleados ya fueron pagados en este período.</p>
      <button onclick="toggleSoloPendientes()" class="mt-3 text-gray-400 underline hover:text-white text-sm">Ver de todas formas</button>
    </div>`;
  }
  $('contenido').innerHTML = html;
}

function renderEmpleado(emp){
  const vh = emp.valor_hora || 0;
  // Calcular pago con días dobles
  let totalHoras = 0, pagoHoras = 0;
  const filasDias = emp.dias.map(d => {
    const clave = emp.id_empleado + '-' + d.dia;
    const esDoble = !!diasDobles[clave];
    const factor = esDoble ? 2 : 1;
    const pagoDia = d.horas * vh * factor;
    totalHoras += d.horas;
    pagoHoras += pagoDia;
    const fechaTxt = new Date(d.dia + 'T12:00:00').toLocaleDateString('es-AR',{weekday:'short', day:'numeric', month:'short'});
    return `<tr class="${esDoble?'bg-amber-900/20':''}">
      <td class="py-2 px-3 text-gray-300">${fechaTxt}</td>
      <td class="py-2 px-3 text-center text-gray-400">${d.entrada} - ${d.salida}</td>
      <td class="py-2 px-3 text-center text-white font-bold">${d.horas.toFixed(2)} h</td>
      <td class="py-2 px-3 text-center">
        <label class="inline-flex items-center gap-1 cursor-pointer">
          <input type="checkbox" ${esDoble?'checked':''} onchange="toggleDoble('${clave}')" class="accent-amber-500">
          <span class="text-xs ${esDoble?'text-amber-400 font-bold':'text-gray-600'}">x2</span>
        </label>
      </td>
      <td class="py-2 px-3 text-right font-bold ${esDoble?'text-amber-400':'text-white'}">${fmt(pagoDia)}</td>
    </tr>`;
  }).join('');

  // Anticipos
  const anticipos = emp.anticipos || [];
  const totalAnticipos = anticipos.reduce((a,x)=>a+x.saldo,0);
  const filasAnt = anticipos.length ? anticipos.map(a => `
    <div class="flex items-center justify-between bg-gray-900 border border-gray-800 rounded-lg p-3 mb-2">
      <div>
        <p class="text-white text-sm font-bold">${fmt(a.saldo)} <span class="text-gray-500 text-xs font-normal">pendiente</span></p>
        <p class="text-gray-500 text-xs">${a.obs || 'Anticipo'} · ${(a.fecha||'').substring(0,10)}${a.descontado>0?(' · ya descontado '+fmt(a.descontado)):''}</p>
      </div>
      <button onclick="descontar(${a.id}, ${a.saldo}, ${emp.id_empleado})" class="text-xs bg-red-900/40 text-red-300 border border-red-800 hover:bg-red-900 px-3 py-1.5 rounded font-bold">Descontar</button>
    </div>`).join('') : '<p class="text-gray-600 text-sm">Sin anticipos pendientes.</p>';

  const neto = pagoHoras - totalAnticipos;

  // Guardar datos calculados para imprimir/pagar
  emp._calc = { totalHoras: totalHoras, pagoHoras: pagoHoras, totalAnticipos: totalAnticipos, neto: neto, dobles: Object.keys(diasDobles).filter(k=>k.startsWith(emp.id_empleado+'-') && diasDobles[k]) };

  return `<div class="bg-black border ${emp.ya_pagado ? 'border-green-800' : 'border-gray-800'} rounded-2xl p-5 mb-5" id="emp-card-${emp.id_empleado}">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-white font-bold text-xl">${emp.nombre} ${emp.apellido} ${emp.ya_pagado ? '<span class="text-xs bg-green-900/50 text-green-400 border border-green-700 px-2 py-0.5 rounded-full ml-2">✅ Pagado</span>' : ''}</h2>
      <span class="text-gray-500 text-sm">Valor hora: ${fmt(vh)}</span>
    </div>

    <div class="overflow-x-auto mb-4">
      <table class="w-full text-sm">
        <thead class="text-xs text-gray-500 border-b border-gray-800">
          <tr><th class="py-2 px-3 text-left">Día</th><th class="py-2 px-3 text-center">Horario</th><th class="py-2 px-3 text-center">Horas</th><th class="py-2 px-3 text-center">Doble</th><th class="py-2 px-3 text-right">Pago</th></tr>
        </thead>
        <tbody class="divide-y divide-gray-800">${filasDias}</tbody>
      </table>
    </div>

    <div class="grid md:grid-cols-2 gap-4">
      <div>
        <p class="text-xs text-gray-500 font-bold uppercase mb-2">Anticipos a descontar</p>
        ${filasAnt}
      </div>
      <div class="bg-gray-900 rounded-xl p-4">
        <div class="flex justify-between py-1.5 text-sm"><span class="text-gray-400">Total horas</span><span class="text-white font-bold">${totalHoras.toFixed(2)} h</span></div>
        <div class="flex justify-between py-1.5 text-sm"><span class="text-gray-400">Pago por horas</span><span class="text-white font-bold">${fmt(pagoHoras)}</span></div>
        <div class="flex justify-between py-1.5 text-sm"><span class="text-gray-400">(−) Anticipos pendientes</span><span class="text-red-400 font-bold">${fmt(totalAnticipos)}</span></div>
        <div class="flex justify-between py-3 mt-2 border-t border-gray-700"><span class="text-white font-bold">NETO A PAGAR</span><span class="text-neon font-bold text-2xl">${fmt(neto)}</span></div>
      </div>
    </div>

    <div class="flex gap-3 mt-4 pt-4 border-t border-gray-800">
      ${emp.ya_pagado
        ? `<div class="flex-1 flex items-center gap-3 bg-green-900/30 border border-green-700 text-green-400 font-bold py-3 px-4 rounded-xl">
            <span class="text-xl">✅</span>
            <div>
              <p class="text-sm font-bold">Ya pagado</p>
              <p class="text-xs text-green-600">Neto: ${fmt(emp.pago_neto)} · ${(emp.pago_fecha||'').substring(0,10)}</p>
              ${(emp.pago_desde||emp.pago_hasta) ? `<p class="text-xs text-green-700/80">Período: ${(emp.pago_desde||'').substring(0,10)} → ${(emp.pago_hasta||'').substring(0,10)}</p>` : ''}
            </div>
           </div>`
        : `<button onclick="marcarPagado(${emp.id_empleado})" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl">✓ Marcar pagado</button>`
      }

async function descontar(idAnticipo, saldo, idEmpleado){
  const entrada = prompt('¿Cuánto querés descontar de este anticipo?\n\nSaldo pendiente: $' + Math.round(saldo).toLocaleString('es-AR') + '\n\n(Escribí el monto, o dejá el total para saldarlo)', Math.round(saldo));
  if(entrada === null) return;
  const monto = parseFloat(entrada);
  if(isNaN(monto) || monto <= 0){ alert('Monto inválido.'); return; }
  if(monto > saldo + 0.01){ alert('No podés descontar más que el saldo pendiente.'); return; }
  try{
    const res = await fetch(`${API_URL}/liquidacion/descontar_anticipo`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id_anticipo: idAnticipo, monto: monto, id_empleado: idEmpleado, observacion: 'Descuento en liquidación' })
    });
    if(res.ok){
      const r = await res.json();
      alert('✅ Descontado ' + fmt(monto) + (r.saldo_restante > 0 ? ('. Queda pendiente ' + fmt(r.saldo_restante)) : '. Anticipo saldado.'));
      cargar(); // recargar para reflejar
    } else {
      const e = await res.json(); alert('❌ ' + (e.detail || 'No se pudo descontar'));
    }
  }catch(e){ alert('❌ Error de conexión.'); }
}

async function marcarPagado(idEmp){
  const emp = datos.find(e=>e.id_empleado===idEmp);
  if(!emp || !emp._calc) return;
  const c = emp._calc;
  let msg = '¿Marcar como PAGADO a ' + emp.nombre + ' ' + emp.apellido + '?\n\n';
  msg += 'Pago por horas: ' + fmt(c.pagoHoras) + '\n';
  if(c.totalAnticipos > 0) msg += 'Se descontarán anticipos por: ' + fmt(c.totalAnticipos) + '\n';
  msg += 'NETO A PAGAR: ' + fmt(c.neto);
  if(!confirm(msg)) return;
  try{
    const res = await fetch(`${API_URL}/liquidacion/marcar_pagado`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        id_empleado: idEmp,
        fecha_desde: $('fecha-desde').value,
        fecha_hasta: $('fecha-hasta').value,
        total_horas: c.totalHoras,
        pago_horas: c.pagoHoras,
        detalle: 'Horas: ' + c.totalHoras.toFixed(2) + ' · Días dobles: ' + c.dobles.length
      })
    });
    if(res.ok){
      const r = await res.json();
      alert('✅ Pago registrado.\nNeto pagado: ' + fmt(r.neto_pagado) + (r.anticipos_descontados>0?('\nAnticipos saldados: ' + fmt(r.anticipos_descontados)):''));
      // Ofrecer imprimir el recibo
      if(confirm('¿Querés imprimir el recibo?')) imprimirRecibo(idEmp);
      cargar();
    } else {
      const e = await res.json(); alert('❌ ' + (e.detail || 'No se pudo registrar'));
    }
  }catch(e){ alert('❌ Error de conexión.'); }
}

// ===== FICHAJES — vista semanal =====
// Semana actual: lunes de la semana en curso
let semanaOffset = 0; // 0 = semana actual, -1 = anterior, etc.

function getLunes(offset) {
    const hoy = new Date();
    const dia = (hoy.getDay() + 6) % 7; // lunes=0
    const lunes = new Date(hoy);
    lunes.setDate(hoy.getDate() - dia + offset * 7);
    lunes.setHours(0,0,0,0);
    return lunes;
}

function isoDate(d) {
    // Usar fecha LOCAL (no UTC) para evitar desfase de zona horaria
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${dd}`;
}

function semanaAnterior()  { semanaOffset--; cargarFichajesLiq(); }
function semanaSiguiente() { semanaOffset++; cargarFichajesLiq(); }

async function cargarFichajesLiq() {
    const idEmp = document.getElementById('fich-empleado').value;
    const el    = document.getElementById('tabla-fichajes-liq');
    if(!idEmp){
        el.innerHTML = '<p class="text-gray-500 text-center py-10">Elegí un empleado para ver su semana.</p>';
        return;
    }
    const lunes  = getLunes(semanaOffset);
    const domingo = new Date(lunes); domingo.setDate(lunes.getDate() + 6);
    // Label semana
    const opts = {day:'numeric', month:'short'};
    document.getElementById('label-semana').textContent =
        lunes.toLocaleDateString('es-AR', opts) + ' — ' + domingo.toLocaleDateString('es-AR', opts);

    // Pedir fichajes de lunes a domingo
    const desde = isoDate(lunes);
    const hasta = isoDate(domingo);
    const url = `${API_URL}/fichajes?fecha=${desde}&id_empleado=${idEmp}`;
    // Pedimos día a día porque la API filtra por fecha exacta
    // Mejor: pedir desde-hasta si el endpoint lo soporta, si no, iteramos
    // Usamos el endpoint de liquidacion/detalle para 7 días
    const [detalleRes, fichajesRaw, planillaRes] = await Promise.all([
        fetch(`${API_URL}/liquidacion/detalle?fecha_desde=${desde}&fecha_hasta=${hasta}`).then(r=>r.json()).catch(()=>[]),
        fetch(`${API_URL}/fichajes_semana?desde=${desde}&hasta=${hasta}&id_empleado=${idEmp}`).then(r=>r.json()).catch(()=>null),
        fetch(`${API_URL}/planilla_horaria?id_empleado=${idEmp}&semana_lunes=${desde}`).then(r=>r.json()).catch(()=>null)
    ]);

    // detalle agrupa por día con entrada/salida calculadas
    const empData = Array.isArray(detalleRes) ? detalleRes.find(e=>String(e.id_empleado)===String(idEmp)) : null;
    const diasDetalle = {}; // dia -> {entrada, salida, horas}
    if(empData) empData.dias.forEach(d => { diasDetalle[d.dia] = d; });

    // fichajes crudos: si el endpoint no existe todavía, los pedimos uno por día
    let fichajesCrudos = [];
    if(Array.isArray(fichajesRaw)) {
        fichajesCrudos = fichajesRaw;
    } else {
        // fallback: pedir los 7 días por separado usando el endpoint existente
        const promesas = [];
        for(let i=0;i<7;i++){
            const d = new Date(lunes); d.setDate(lunes.getDate()+i);
            promesas.push(fetch(`${API_URL}/fichajes?fecha=${isoDate(d)}&id_empleado=${idEmp}`).then(r=>r.json()).catch(()=>[]));
        }
        const resultados = await Promise.all(promesas);
        fichajesCrudos = resultados.flat();
    }

    // Indexar crudos por fecha
    const crudosPorDia = {};
    fichajesCrudos.forEach(f => {
        const dia = (f.fecha_hora||'').substring(0,10);
        if(!crudosPorDia[dia]) crudosPorDia[dia] = [];
        crudosPorDia[dia].push(f);
    });
    // Planilla indexada por día de semana (0=lun...6=dom)
    const planPorDia = {};
    if(Array.isArray(planillaRes)) planillaRes.forEach(p => { planPorDia[p.dia_semana] = p; });

    // Helper: diferencia en minutos entre hora planificada y fichada
    function diffMin(horaBase, fechaHoraFichada) {
        if(!horaBase || !fechaHoraFichada) return null;
        const [hb,mb] = horaBase.substring(0,5).split(':').map(Number);
        const hf = parseInt((fechaHoraFichada||'').substring(11,13));
        const mf = parseInt((fechaHoraFichada||'').substring(14,16));
        return Math.abs((hf*60+mf) - (hb*60+mb));
    }

    const diasSemana = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
    let html = '<div class="space-y-2">';
    for(let i=0; i<7; i++){
        const fecha = new Date(lunes); fecha.setDate(lunes.getDate()+i);
        const diaStr = isoDate(fecha);
        const esDom  = i === 6;
        const detalle = diasDetalle[diaStr];
        const crudos  = crudosPorDia[diaStr] || [];
        const plan    = planPorDia[i];
        const sinFichaje = crudos.length === 0;
        const planificado = plan && plan.trabaja;

        const entradaInput = crudos.find(f=>f.tipo==='entrada');
        const salidaInput  = crudos.find(f=>f.tipo==='salida');

        // Desvíos: > 10 min de diferencia con planificado
        const diffEnt = plan ? diffMin(plan.hora_entrada, entradaInput?.fecha_hora) : null;
        const diffSal = plan ? diffMin(plan.hora_salida,  salidaInput?.fecha_hora)  : null;
        const desvioEntrada = diffEnt !== null && diffEnt > 10;
        const desvioSalida  = diffSal !== null && diffSal > 10;

        // Alerta roja: sin fichaje (y día planificado), o desvío importante
        const alertaSinFichaje = sinFichaje && planificado;
        const alertaDesvio = desvioEntrada || desvioSalida;
        const alertaRoja   = alertaSinFichaje || alertaDesvio;
        const bgRow = alertaRoja
            ? 'bg-red-950/30 border border-red-800'
            : (planificado ? 'bg-black border border-gray-700' : 'bg-gray-950 border border-gray-900');

        const entradaVal = entradaInput ? (entradaInput.fecha_hora||'').substring(0,16) : '';
        const salidaVal  = salidaInput  ? (salidaInput.fecha_hora||'').substring(0,16)  : '';

        const horas = detalle ? detalle.horas.toFixed(2) + ' h' : (sinFichaje ? '—' : '?');
        const horasColor = sinFichaje ? 'text-red-400' : 'text-neon font-bold';

        // Planificado hint
        const planHint = plan && plan.trabaja
            ? `<span class="text-xs text-gray-500">Plan: ${plan.hora_entrada||'?'} - ${plan.hora_salida||'?'}</span>`
            : (!plan ? '' : '<span class="text-xs text-gray-700">No planificado</span>');

        let alertaMsg = '';
        if(alertaSinFichaje) alertaMsg = `⚠ Sin fichaje${esDom?' — se pagará según planilla':''}`;
        else if(desvioEntrada && desvioSalida) alertaMsg = `⚠ Entrada y salida con desvío > 10 min`;
        else if(desvioEntrada) alertaMsg = `⚠ Entrada con desvío de ${diffEnt} min`;
        else if(desvioSalida)  alertaMsg = `⚠ Salida con desvío de ${diffSal} min`;

        html += `<div class="${bgRow} rounded-xl p-4">
          <div class="flex items-center gap-4 flex-wrap">
            <div class="w-20 shrink-0">
              <p class="text-xs text-gray-500 font-bold">${diasSemana[i]}</p>
              <p class="text-white font-bold">${fecha.getDate()}/${fecha.getMonth()+1}</p>
              ${esDom ? '<span class="text-xs text-orange-400 font-bold">Dom</span>' : ''}
            </div>
            <div class="flex gap-4 flex-1 items-center flex-wrap">
              <div>
                <label class="block text-xs mb-0.5 ${desvioEntrada?'text-red-400':'text-gray-500'}">Entrada ${desvioEntrada?'⚠':''}</label>
                <input type="datetime-local" value="${entradaVal}"
                  onchange="editarOCrearFichaje('entrada','${diaStr}',${idEmp},this.value,${entradaInput?entradaInput.id:'null'})"
                  class="bg-gray-900 border ${(alertaSinFichaje||desvioEntrada)?'border-red-700':'border-gray-700'} text-white rounded-lg px-2 py-1.5 text-sm w-44">
              </div>
              <div>
                <label class="block text-xs mb-0.5 ${desvioSalida?'text-red-400':'text-gray-500'}">Salida ${desvioSalida?'⚠':''}</label>
                <input type="datetime-local" value="${salidaVal}"
                  onchange="editarOCrearFichaje('salida','${diaStr}',${idEmp},this.value,${salidaInput?salidaInput.id:'null'})"
                  class="bg-gray-900 border ${(alertaSinFichaje||desvioSalida)?'border-red-700':'border-gray-700'} text-white rounded-lg px-2 py-1.5 text-sm w-44">
              </div>
              <div class="text-center">
                <p class="text-xs text-gray-500 mb-0.5">Horas</p>
                <p class="${horasColor} text-lg">${horas}</p>
                ${planHint}
              </div>
            </div>
            ${alertaMsg ? `<div class="w-full mt-1"><p class="text-red-400 text-xs font-bold">${alertaMsg}</p></div>` : ''}
          </div>
        </div>`;
    }
    html += '</div>';
    el.innerHTML = html;
}

async function editarOCrearFichaje(tipo, dia, idEmp, valor, idExistente) {
    if(!valor) return;
    const fechaHora = valor.length === 16 ? valor + ':00' : valor;
    if(idExistente && idExistente !== 'null') {
        // Editar existente
        const r = await fetch(`${API_URL}/fichajes/${idExistente}`, {
            method:'PUT', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({fecha_hora: fechaHora})
        });
        if(r.ok) showToast('✅ Fichaje actualizado');
        else { showToast('❌ Error al actualizar', true); cargarFichajesLiq(); }
    } else {
        // Crear nuevo
        const r = await fetch(`${API_URL}/fichajes/manual`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({id_empleado: parseInt(idEmp), tipo, fecha_hora: fechaHora, observacion: 'Cargado desde liquidación'})
        });
        if(r.ok) { showToast('✅ Fichaje registrado'); setTimeout(cargarFichajesLiq, 300); }
        else { const e = await r.json(); showToast('❌ ' + (e.detail||'Error'), true); }
    }
}

async function editarFichajeInline(id, nuevaFechaHora) {
    const r = await fetch(API_URL+'/fichajes/'+id, {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({fecha_hora: nuevaFechaHora+':00'})
    });
    if(r.ok){ showToast('✅ Fichaje actualizado'); }
    else { showToast('❌ Error al actualizar', true); cargarFichajesLiq(); }
}

async function eliminarFichajeConf(id) {
    if(!confirm('¿Eliminar este fichaje?')) return;
    await fetch(API_URL+'/fichajes/'+id, {method:'DELETE'});
    cargarFichajesLiq();
}

function abrirModalFichajeNuevo() {
    document.getElementById('mfich-id').value = '';
    document.getElementById('modal-fich-titulo').textContent = 'Agregar fichaje';
    const lunes = getLunes(semanaOffset);
    document.getElementById('mfich-fecha').value = isoDate(lunes) + 'T08:00';
    document.getElementById('mfich-obs').value = '';
    // Pre-seleccionar el empleado activo
    const idEmp = document.getElementById('fich-empleado').value;
    if(idEmp) document.getElementById('mfich-emp').value = idEmp;
    document.getElementById('modal-fichaje').classList.remove('hidden');
}

function cerrarModalFichaje() {
    document.getElementById('modal-fichaje').classList.add('hidden');
}

async function guardarFichajeModal() {
    const idEmp = document.getElementById('mfich-emp').value;
    const tipo  = document.getElementById('mfich-tipo').value;
    const fecha = document.getElementById('mfich-fecha').value;
    const obs   = document.getElementById('mfich-obs').value;
    if(!idEmp || !fecha){ alert('Elegí el empleado y la fecha.'); return; }
    const r = await fetch(API_URL+'/fichajes/manual', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({id_empleado: parseInt(idEmp), tipo, fecha_hora: fecha+':00', observacion: obs||'Cargado desde liquidación'})
    });
    if(r.ok){ cerrarModalFichaje(); cargarFichajesLiq(); showToast('✅ Fichaje registrado'); }
    else { const e = await r.json(); alert('❌ ' + (e.detail||'Error')); }
}

// ===== ANTICIPOS =====
function initFiltroAnticiposLiq() {
    const hoy = new Date();
    const desde = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    if (!document.getElementById('ant-desde-fil').value)
        document.getElementById('ant-desde-fil').value = desde.toISOString().split('T')[0];
    if (!document.getElementById('ant-hasta-fil').value)
        document.getElementById('ant-hasta-fil').value = hoy.toISOString().split('T')[0];
}

async function registrarAnticipoLiq() {
    const idEmp = document.getElementById('ant-empleado-sel').value;
    const monto = parseFloat(document.getElementById('ant-monto').value);
    const obs   = document.getElementById('ant-obs').value || 'Anticipo';
    if(!idEmp){ alert('Elegí el empleado.'); return; }
    if(!monto || monto <= 0){ alert('Ingresá un monto válido.'); return; }
    const r = await fetch(API_URL+'/anticipos', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({id_empleado: parseInt(idEmp), monto, observaciones: obs})
    });
    if(r.ok){
        document.getElementById('ant-monto').value = '';
        document.getElementById('ant-obs').value = '';
        showToast('✅ Anticipo registrado por $' + monto.toLocaleString('es-AR'));
        cargarAnticiposLiq();
    } else {
        const e = await r.json(); alert('❌ ' + (e.detail||'Error'));
    }
}

async function cargarAnticiposLiq() {
    const desde = document.getElementById('ant-desde-fil').value;
    const hasta = document.getElementById('ant-hasta-fil').value;
    if(!desde || !hasta) return;
    const lista = await fetch(API_URL+'/anticipos?fecha_desde='+desde+'&fecha_hasta='+hasta).then(r=>r.json()).catch(()=>[]);
    const el = document.getElementById('tabla-anticipos-liq');
    if(!lista.length){ el.innerHTML = '<p class="text-gray-500 text-center py-10">Sin anticipos en ese período.</p>'; return; }
    el.innerHTML = '<div class="space-y-2">' + lista.map(a => {
        const badge = a.pagado
            ? '<span class="text-xs bg-green-900/40 text-green-400 border border-green-800 px-2 py-0.5 rounded-full">✅ Descontado</span>'
            : '<span class="text-xs bg-orange-900/40 text-orange-400 border border-orange-800 px-2 py-0.5 rounded-full">⏳ Pendiente</span>';
        return '<div class="bg-black border border-gray-800 rounded-xl p-4 flex items-center gap-4">' +
            '<div class="flex-1">' +
              '<p class="text-white font-bold">'+(a.apellido||'')+', '+(a.nombre||'')+'</p>' +
              '<p class="text-gray-500 text-xs">'+(a.observaciones||'Anticipo')+' · '+(a.fecha||'').substring(0,10)+'</p>' +
            '</div>' +
            '<div class="text-right">' +
              '<p class="text-neon font-bold text-lg">$'+parseFloat(a.monto||0).toLocaleString('es-AR')+'</p>' +
              badge +
            '</div>' +
        '</div>';
    }).join('') + '</div>';
}

// ===== HISTORIAL ANUAL =====
async function cargarHistAnual() {
    const idEmp = document.getElementById('anual-empleado').value;
    const anio  = document.getElementById('anual-anio').value;
    if(!idEmp){ alert('Elegí el empleado.'); return; }
    const data = await fetch(API_URL+'/liquidacion/historial_anual/'+idEmp+'?anio='+anio).then(r=>r.json()).catch(()=>null);
    const el = document.getElementById('contenido-anual');
    if(!data){ el.innerHTML = '<p class="text-red-400 text-center py-10">Error al cargar.</p>'; return; }
    const emp = data.empleado || {};
    const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    // Agrupar pagos por mes
    const pagosPorMes = {};
    (data.pagos||[]).forEach(p => {
        const m = parseInt((p.fecha_pago||'').substring(5,7)) - 1;
        if(!pagosPorMes[m]) pagosPorMes[m] = [];
        pagosPorMes[m].push(p);
    });
    const filasPagos = (data.pagos||[]).map(p => {
        const desde = (p.fecha_desde||'').substring(0,10);
        const hasta = (p.fecha_hasta||'').substring(0,10);
        const fpago = (p.fecha_pago||'').substring(0,10);
        return '<tr class="border-b border-gray-800">' +
            '<td class="p-3 text-gray-400">'+fpago+'</td>' +
            '<td class="p-3 text-gray-300 text-xs">'+desde+' → '+hasta+'</td>' +
            '<td class="p-3 text-center text-gray-300">'+(parseFloat(p.total_horas||0).toFixed(1))+'h</td>' +
            '<td class="p-3 text-right text-white">$'+Math.round(p.pago_horas||0).toLocaleString('es-AR')+'</td>' +
            '<td class="p-3 text-right text-red-400">'+((p.anticipos_descontados>0)?'-$'+Math.round(p.anticipos_descontados).toLocaleString('es-AR'):'')+'</td>' +
            '<td class="p-3 text-right text-neon font-bold">$'+Math.round(p.neto_pagado||0).toLocaleString('es-AR')+'</td>' +
        '</tr>';
    }).join('');
    const filasAnt = (data.anticipos||[]).map(a => {
        return '<tr class="border-b border-gray-800">' +
            '<td class="p-3 text-gray-400">'+(a.fecha||'').substring(0,10)+'</td>' +
            '<td class="p-3 text-gray-300">'+(a.observaciones||'Anticipo')+'</td>' +
            '<td class="p-3 text-right text-orange-400 font-bold">$'+Math.round(a.monto||0).toLocaleString('es-AR')+'</td>' +
            '<td class="p-3 text-center">'+(a.pagado?'<span class="text-green-400 text-xs">✅</span>':'<span class="text-orange-400 text-xs">⏳</span>')+'</td>' +
        '</tr>';
    }).join('');
    el.innerHTML = `
      <div class="grid md:grid-cols-3 gap-4 mb-6">
        <div class="bg-black border border-gray-800 rounded-xl p-4 text-center">
          <p class="text-gray-500 text-xs uppercase font-bold mb-1">Total cobrado</p>
          <p class="text-neon font-black text-2xl">$${Math.round(data.total_pagado||0).toLocaleString('es-AR')}</p>
          <p class="text-gray-600 text-xs">${data.pagos.length} liquidaciones</p>
        </div>
        <div class="bg-black border border-gray-800 rounded-xl p-4 text-center">
          <p class="text-gray-500 text-xs uppercase font-bold mb-1">Horas trabajadas</p>
          <p class="text-white font-black text-2xl">${(data.total_horas||0).toFixed(1)} h</p>
          <p class="text-gray-600 text-xs">en ${anio}</p>
        </div>
        <div class="bg-black border border-gray-800 rounded-xl p-4 text-center">
          <p class="text-gray-500 text-xs uppercase font-bold mb-1">Anticipos recibidos</p>
          <p class="text-orange-400 font-black text-2xl">$${Math.round(data.total_anticipos||0).toLocaleString('es-AR')}</p>
          <p class="text-gray-600 text-xs">${data.anticipos.length} anticipos</p>
        </div>
      </div>
      ${data.pagos.length ? `
      <div class="bg-black border border-gray-800 rounded-2xl overflow-hidden mb-5">
        <div class="px-5 py-3 border-b border-gray-800"><p class="text-white font-bold">💵 Liquidaciones del año</p></div>
        <table class="w-full text-sm">
          <thead class="text-xs text-gray-500 border-b border-gray-800">
            <tr><th class="p-3 text-left">Fecha pago</th><th class="p-3 text-left">Período</th><th class="p-3 text-center">Horas</th><th class="p-3 text-right">Bruto</th><th class="p-3 text-right">Anticipos</th><th class="p-3 text-right">Neto</th></tr>
          </thead>
          <tbody>${filasPagos}</tbody>
          <tfoot class="bg-gray-900 text-sm font-bold">
            <tr><td colspan="3" class="p-3 text-gray-400">TOTAL AÑO</td><td class="p-3 text-right text-white">-</td><td class="p-3 text-right text-red-400">-</td><td class="p-3 text-right text-neon">$${Math.round(data.total_pagado).toLocaleString('es-AR')}</td></tr>

// ===== PLANILLA HORARIA =====
let planOffset = 0;
const DIAS_PLAN = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

function planLunes(offset) { return getLunes(offset); } // reutiliza getLunes de fichajes

function planSemanaAnterior()  { planOffset--; cargarPlanilla(); }
function planSemanaSiguiente() { planOffset++; cargarPlanilla(); }

let planDatos = [];      // estado de los 7 días mientras se edita
let planEdiciones = 0;   // cuántas veces fue guardada esta planilla
let planBloqueada = false;

async function cargarPlanilla() {
    const idEmp = document.getElementById('plan-empleado').value;
    const el    = document.getElementById('tabla-planilla');
    if(!idEmp){ el.innerHTML = '<p class="text-gray-500 text-center py-10">Elegí un empleado.</p>'; return; }
    const lunes = planLunes(planOffset);
    const lunStr = isoDate(lunes);
    const domingo = new Date(lunes); domingo.setDate(lunes.getDate()+6);
    const opts = {day:'numeric', month:'short'};
    document.getElementById('label-semana-plan').textContent =
        lunes.toLocaleDateString('es-AR', opts) + ' — ' + domingo.toLocaleDateString('es-AR', opts);
    const raw = await fetch(`${API_URL}/planilla_horaria?id_empleado=${idEmp}&semana_lunes=${lunStr}`).then(r=>r.json()).catch(()=>null);
    if(!raw){ el.innerHTML = '<p class="text-red-400 text-center py-10">Error al cargar planilla.</p>'; return; }
    // compat: nuevo endpoint devuelve {dias, ediciones, bloqueada}; viejo devuelve array
    if(Array.isArray(raw)) {
        planDatos = raw; planEdiciones = 0; planBloqueada = false;
    } else {
        planDatos = raw.dias || []; planEdiciones = raw.ediciones || 0; planBloqueada = !!raw.bloqueada;
    }
    renderPlanilla(idEmp, lunStr);
}

function renderPlanilla(idEmp, lunStr) {
    const LIMITE = 2;
    const el = document.getElementById('tabla-planilla');
    // Badge de ediciones (admin ve todo)
    let badgeHtml = '';
    const usuRol = (window.USUARIO||{}).rol || '';
    if(planBloqueada) {
        badgeHtml = `<div class="mb-3 flex items-center gap-3 bg-red-950/40 border border-red-900 rounded-xl p-3">
            <span class="text-lg">🔒</span>
            <div class="flex-1 text-sm"><b class="text-red-300">Planilla bloqueada</b> — Alejandra no puede modificarla.</div>
            ${usuRol==='admin'?`<button onclick="desbloquearPlanilla('${idEmp}','${lunStr}')" class="bg-neon text-black text-xs font-bold px-3 py-1.5 rounded-lg">Desbloquear</button>`:''}
        </div>`;
    } else if(planEdiciones >= LIMITE) {
        badgeHtml = `<div class="mb-3 flex items-center gap-3 bg-orange-950/40 border border-orange-900 rounded-xl p-3">
            <span class="text-lg">⚠️</span>
            <div class="flex-1 text-sm"><b class="text-orange-300">Límite de ediciones alcanzado (${planEdiciones}/${LIMITE})</b> — Alejandra no puede hacer más cambios.</div>
            ${usuRol==='admin'?`<button onclick="desbloquearPlanilla('${idEmp}','${lunStr}')" class="bg-neon text-black text-xs font-bold px-3 py-1.5 rounded-lg">Resetear ediciones</button>`:''}
        </div>`;
    } else if(planEdiciones > 0) {
        badgeHtml = `<div class="mb-3 text-xs text-gray-500 flex items-center gap-2">
            <span class="bg-gray-800 border border-gray-700 px-2 py-1 rounded">Edición ${planEdiciones}/${LIMITE}</span>
            <span>Alejandra tiene ${LIMITE - planEdiciones} modificación${LIMITE-planEdiciones!==1?'es':''} disponible${LIMITE-planEdiciones!==1?'s':''} para esta semana.</span>
        </div>`;
    }
    el.innerHTML = `
      ${badgeHtml}
      <div class="bg-black border border-gray-800 rounded-2xl overflow-hidden mb-4">
        <table class="w-full text-sm">
          <thead class="text-xs text-gray-500 border-b border-gray-800">
            <tr>
              <th class="p-3 text-left">Día</th>
              <th class="p-3 text-center">¿Trabaja?</th>
              <th class="p-3 text-center">Entrada</th>
              <th class="p-3 text-center">Salida</th>
              <th class="p-3 text-left">Obs.</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-800">
            ${planDatos.map((d,i) => {
              const esDom = i === 6;
              return `<tr class="${esDom?'bg-orange-950/20':''}">
                <td class="p-3">
                  <span class="text-white font-bold">${DIAS_PLAN[i]}</span>
                  ${esDom?'<span class="ml-1 text-xs text-orange-400">+pago planificado</span>':''}
                </td>
                <td class="p-3 text-center">
                  <div onclick="toggleTrabaja(${i})" data-on="${d.trabaja?'1':'0'}"
                    style="display:inline-flex;align-items:center;cursor:pointer;width:40px;height:22px;border-radius:11px;padding:2px;transition:background .2s;background:${d.trabaja?'#d4ff3f':'#374151'}">
                    <div style="width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;transform:${d.trabaja?'translateX(18px)':'translateX(0)'}"></div>
                  </div>
                </td>
                <td class="p-3 text-center">
                  <input type="time" value="${d.hora_entrada||''}" ${d.trabaja?'':'disabled'}
                    oninput="planDatos[${i}].hora_entrada=this.value"
                    class="bg-gray-900 border border-gray-700 text-white rounded px-2 py-1 text-sm w-24 disabled:opacity-30">
                </td>
                <td class="p-3 text-center">
                  <input type="time" value="${d.hora_salida||''}" ${d.trabaja?'':'disabled'}
                    oninput="planDatos[${i}].hora_salida=this.value"
                    class="bg-gray-900 border border-gray-700 text-white rounded px-2 py-1 text-sm w-24 disabled:opacity-30">
                </td>
                <td class="p-3">
                  <input type="text" value="${d.observacion||''}" placeholder="opcional"
                    oninput="planDatos[${i}].observacion=this.value"
                    class="bg-gray-900 border border-gray-700 text-white rounded px-2 py-1 text-xs w-32">
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="flex justify-end gap-3 flex-wrap">
        <p class="text-xs text-gray-500 self-center">Los cambios no se guardan solos — tocá Guardar.</p>
        <button onclick="guardarPlanilla('${idEmp}','${lunStr}')" class="bg-neon text-black font-bold px-6 py-2.5 rounded-xl">💾 Guardar planilla</button>
      </div>
    `;
}

function toggleTrabaja(idx) {
    planDatos[idx].trabaja = !planDatos[idx].trabaja;
    const idEmp = document.getElementById('plan-empleado').value;
    const lunes = isoDate(planLunes(planOffset));
    renderPlanilla(idEmp, lunes);
}

async function guardarPlanilla(idEmp, lunStr) {
    const u = window.USUARIO || {};
    const r = await fetch(`${API_URL}/planilla_horaria`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            id_empleado:   parseInt(idEmp),
            semana_lunes:  lunStr,
            dias:          planDatos,
            id_usuario:    u.id || null,
            nombre_editor: u.nombre || u.email || 'admin',
            rol_editor:    u.rol || 'admin'
        })
    });
    const res = await r.json().catch(()=>({}));
    if(r.ok) {
        planEdiciones = res.ediciones || planEdiciones + 1;
        showToast('✅ Planilla guardada');
        renderPlanilla(idEmp, lunStr);
    } else {
        showToast('❌ ' + (res.detail||'Error'), true);
    }
}

async function desbloquearPlanilla(idEmp, lunStr) {
    const r = await fetch(`${API_URL}/planilla_horaria/desbloquear`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({id_empleado: parseInt(idEmp), semana_lunes: lunStr})
    });
    if(r.ok) {
        planEdiciones = 0; planBloqueada = false;
        showToast('🔓 Planilla desbloqueada. Alejandra puede editarla nuevamente.');
        renderPlanilla(idEmp, lunStr);
    } else {
        showToast('❌ Error al desbloquear', true);
    }
}

async function copiarSemanaAnterior() {
    const idEmp = document.getElementById('plan-empleado').value;
    if(!idEmp){ showToast('Elegí el empleado primero.', true); return; }
    const lunStr = isoDate(planLunes(planOffset));
    const raw = await fetch(`${API_URL}/planilla_horaria/semana_anterior?id_empleado=${idEmp}&semana_lunes=${lunStr}`).then(r=>r.json()).catch(()=>null);
    const datos = Array.isArray(raw) ? raw : (raw||[]);
    if(!datos.length || datos.every(d=>!d.trabaja)){
        showToast('⚠ La semana anterior no tiene planilla cargada', true); return;
    }
    planDatos = datos;
    renderPlanilla(idEmp, lunStr);
    showToast('↩ Planilla de semana anterior cargada — revisá y guardá');
}

// ===== TOAST =====
function showToast(msg, error=false) {
    let t = document.getElementById('toast-liq');
    if(!t){ t = document.createElement('div'); t.id='toast-liq'; t.style.cssText='position:fixed;bottom:24px;right:24px;z-index:9999;padding:12px 20px;border-radius:12px;font-weight:bold;font-size:14px;transition:opacity .3s'; document.body.appendChild(t); }
    t.textContent = msg;
    t.style.background = error ? '#7f1d1d' : '#1a2e05';
    t.style.color = error ? '#fca5a5' : '#d4ff3f';
    t.style.border = '1px solid ' + (error ? '#991b1b' : '#365314');
    t.style.opacity = '1';
    clearTimeout(t._to);
    t._to = setTimeout(()=>{ t.style.opacity='0'; }, 2800);
}
