<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reparto Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --neon: #e4fc74; }
  .text-neon { color: var(--neon); }
  .bg-neon { background-color: var(--neon); }
  body { background:#0a0a0a; }
  .tab-btn { padding: 10px 16px; font-size: 14px; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
  .tab-btn.active { border-bottom-color: var(--neon); color: var(--neon); }
</style>
</head>
<body class="text-white min-h-screen">
  <header class="border-b border-gray-800 px-4 py-3 flex justify-between items-center sticky top-0 bg-black z-30">
    <h1 class="font-bold text-lg">👨‍💼 Reparto Admin</h1>
    <button onclick="salirAdmin()" class="border border-gray-700 text-gray-400 rounded-lg px-3 py-2 text-sm">Salir</button>
  </header>

  <div class="border-b border-gray-800 px-4 flex gap-2 bg-gray-950">
    <button class="tab-btn active" onclick="switchTab('pedidos')">📲 Pedidos catálogo</button>
    <button class="tab-btn" onclick="switchTab('catalogo')">🎨 Catálogo</button>
    <button class="tab-btn" onclick="switchTab('margenes')">⚙️ Márgenes</button>
  </div>

  <div class="p-4">
    <!-- TAB: Pedidos Catálogo -->
    <div id="tab-pedidos" class="block">
      <div class="flex gap-2 mb-4">
        <select id="filtro-vendedor-pedidos" onchange="renderPedidos()" class="bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
          <option value="">— Todos los vendedores —</option>
        </select>
        <select id="filtro-estado-pedidos" onchange="renderPedidos()" class="bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
          <option value="">— Todos los estados —</option>
          <option value="nuevo">Nuevo</option>
          <option value="contactado">Contactado</option>
          <option value="confirmado">Confirmado</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <button onclick="renderPedidos()" class="bg-neon text-black font-bold px-4 py-2 rounded text-sm">🔄 Actualizar</button>
      </div>
      <div id="lista-pedidos" class="space-y-2"></div>
    </div>

    <!-- TAB: Catálogo -->
    <div id="tab-catalogo" class="hidden">
      <div class="flex gap-2 mb-4">
        <select id="select-vendedor-cat" onchange="cargarCatalogoCotrol()" class="bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
          <option value="">— Selecciona vendedor —</option>
        </select>
      </div>
      <div id="lista-catalogo" class="space-y-2"></div>
    </div>

    <!-- TAB: Márgenes -->
    <div id="tab-margenes" class="hidden">
      <div class="flex gap-2 mb-4">
        <select id="select-vendedor-margen" onchange="cargarMargen()" class="bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
          <option value="">— Selecciona vendedor —</option>
        </select>
      </div>
      <div id="panel-margen" class="hidden bg-gray-900 border border-gray-700 rounded-lg p-4">
        <div class="mb-4">
          <label class="block text-xs text-gray-500 font-bold mb-2">Margen de venta (%)</label>
          <input id="input-margen" type="number" step="0.1" min="0" max="100" class="w-32 bg-black border border-gray-700 text-white rounded p-2">
        </div>
        <button onclick="guardarMargen()" class="bg-neon text-black font-bold px-4 py-2 rounded">Guardar</button>
      </div>
    </div>
  </div>

<script>
  const API_URL = '/api';
  let vendedorActual = null;
  let pedidos = [];
  let repartidores = [];
  let catalogoActual = []; // Guardar estado de productos

  // INIT
  async function init(){
    await cargarRepartidores();
    await renderPedidos();
  }

  async function cargarRepartidores(){
    try {
      var res = await fetch(API_URL+'/reparto/empleados');
      repartidores = await res.json();
      
      ['filtro-vendedor-pedidos', 'select-vendedor-cat', 'select-vendedor-margen'].forEach(id => {
        var sel = document.getElementById(id);
        sel.innerHTML = '<option value="">— Selecciona vendedor —</option>';
        repartidores.forEach(r => {
          var opt = document.createElement('option');
          opt.value = r.id;
          opt.textContent = r.nombre + ' ' + (r.apellido || '');
          sel.appendChild(opt);
        });
      });
    } catch(e){ console.error(e); }
  }

  async function renderPedidos(){
    var id_vendedor = document.getElementById('filtro-vendedor-pedidos').value || null;
    var estado = document.getElementById('filtro-estado-pedidos').value || null;
    try {
      var url = API_URL + '/catalogo-pedidos';
      if (id_vendedor) url += '?id_vendedor=' + id_vendedor;
      if (estado) url += (id_vendedor ? '&' : '?') + 'estado=' + estado;
      
      var res = await fetch(url);
      pedidos = await res.json();
      
      var cont = document.getElementById('lista-pedidos');
      cont.innerHTML = '';
      if (!pedidos.length){ cont.innerHTML = '<p class="text-gray-600 text-sm">Sin pedidos.</p>'; return; }
      
      pedidos.forEach(p => {
        var div = document.createElement('div');
        div.className = 'bg-gray-900 border border-gray-700 rounded-lg p-3';
        div.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <p class="font-bold">#${p.id} - ${p.cliente_nombre}</p>
              <p class="text-xs text-gray-500">${p.cliente_telefono}</p>
            </div>
            <p class="text-neon font-bold">$ ${p.total.toFixed(2)}</p>
          </div>
          <div class="flex gap-2 mb-2 text-xs">
            <span class="bg-gray-800 px-2 py-1 rounded">${p.estado}</span>
            <span class="bg-gray-800 px-2 py-1 rounded">${new Date(p.fecha).toLocaleDateString()}</span>
          </div>
          <select onchange="cambiarEstadoPedido(${p.id}, this.value)" class="w-full bg-black border border-gray-700 text-white rounded p-1 text-xs mb-2">
            <option value="nuevo" ${p.estado=='nuevo'?'selected':''}>Nuevo</option>
            <option value="contactado" ${p.estado=='contactado'?'selected':''}>Contactado</option>
            <option value="confirmado" ${p.estado=='confirmado'?'selected':''}>Confirmado</option>
            <option value="cancelado" ${p.estado=='cancelado'?'selected':''}>Cancelado</option>
          </select>
        `;
        cont.appendChild(div);
      });
    } catch(e){ console.error(e); }
  }

  async function cambiarEstadoPedido(id, estado){
    try {
      await fetch(API_URL+'/catalogo-pedidos/'+id+'/estado', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(estado)
      });
      await renderPedidos();
    } catch(e){ console.error(e); }
  }

  async function cargarCatalogoCotrol(){
    var id = document.getElementById('select-vendedor-cat').value;
    if (!id){ document.getElementById('lista-catalogo').innerHTML = ''; return; }
    
    try {
      var res = await fetch(API_URL+'/catalogo/'+id+'/productos-admin');
      catalogoActual = await res.json(); // Guardar en variable global
      
      var cont = document.getElementById('lista-catalogo');
      cont.innerHTML = '';
      
      catalogoActual.forEach(p => {
        var div = document.createElement('div');
        div.className = 'bg-gray-900 border border-gray-700 rounded-lg p-3 flex justify-between items-center';
        div.innerHTML = `
          <div class="flex-1">
            <p class="font-bold">${p.nombre}</p>
            <p class="text-xs text-gray-500">$ ${p.precio_mayorista}</p>
          </div>
          <div class="flex gap-2 items-center">
            <input type="checkbox" id="check-${p.id}" ${p.visible?'checked':''} onchange="toggleVisibleProducto(${id}, ${p.id}, this.checked)" class="cursor-pointer w-5 h-5">
            <input type="number" id="orden-${p.id}" value="${p.orden}" step="1" onchange="cambiarOrdenProducto(${id}, ${p.id}, this.value, this.checked)" class="w-16 bg-black border border-gray-700 text-white rounded p-1 text-xs" placeholder="Orden">
          </div>
        `;
        cont.appendChild(div);
      });
    } catch(e){ console.error(e); }
  }

  async function toggleVisibleProducto(id_vendedor, id_producto, visible){
    try {
      // Obtener el orden actual sin cambiar
      var orden_input = document.getElementById('orden-'+id_producto);
      var orden = orden_input ? parseInt(orden_input.value) : 0;
      
      await fetch(API_URL+'/catalogo/'+id_vendedor+'/productos/'+id_producto+'/visible', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ visible: visible, orden: orden })
      });
      console.log('✓ Visibilidad actualizada:', visible ? 'Visible' : 'Oculto');
    } catch(e){ console.error(e); }
  }

  async function cambiarOrdenProducto(id_vendedor, id_producto, orden){
    try {
      // Obtener estado del checkbox (visible actual)
      var check = document.getElementById('check-'+id_producto);
      var visible = check ? check.checked : false;
      
      await fetch(API_URL+'/catalogo/'+id_vendedor+'/productos/'+id_producto+'/visible', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ visible: visible, orden: parseInt(orden) })
      });
      console.log('✓ Orden actualizado:', orden);
    } catch(e){ console.error(e); }
  }

  async function cargarMargen(){
    var id = document.getElementById('select-vendedor-margen').value;
    if (!id){ document.getElementById('panel-margen').classList.add('hidden'); return; }
    
    try {
      var res = await fetch(API_URL+'/reparto/vendedor/margen/'+id);
      var data = await res.json();
      vendedorActual = id;
      document.getElementById('input-margen').value = data.margen || 0;
      document.getElementById('panel-margen').classList.remove('hidden');
    } catch(e){ console.error(e); }
  }

  async function guardarMargen(){
    if (!vendedorActual){ alert('Selecciona vendedor'); return; }
    var margen = parseFloat(document.getElementById('input-margen').value);
    try {
      await fetch(API_URL+'/reparto/vendedor/margen/'+vendedorActual, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ margen_venta_porcentaje_default: margen })
      });
      alert('✓ Margen guardado');
    } catch(e){ console.error(e); }
  }

  function switchTab(tab){
    ['pedidos', 'catalogo', 'margenes'].forEach(t => {
      document.getElementById('tab-'+t).classList[t===tab?'remove':'add']('hidden');
    });
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  }

  function salirAdmin(){
    sessionStorage.clear();
    window.location.href = '/reparto-login';
  }

  init();
</script>
</body>
</html>
