<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reparto — Reportes</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --neon: #e4fc74; }
  .text-neon { color: var(--neon); }
  .bg-neon { background-color: var(--neon); }
  body { background:#0a0a0a; }
</style>
</head>
<body class="text-white min-h-screen">
  <header class="border-b border-gray-800 px-4 py-3 flex justify-between items-center sticky top-0 bg-black z-20">
    <div>
      <h1 class="font-bold text-lg">🚚 Reparto — Reportes</h1>
      <p class="text-gray-500 text-xs">Seguimiento de clientes y ventas en la calle</p>
    </div>
    <a href="/admin" class="text-xs text-gray-400 hover:text-white border border-gray-700 rounded px-3 py-1.5">← Volver</a>
  </header>

  <div class="max-w-4xl mx-auto p-4">
    <!-- Filtro fechas -->
    <div class="flex gap-2 mb-4 items-end">
      <div><label class="block text-xs text-gray-500 mb-1">Desde</label><input id="desde" type="date" class="bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm"></div>
      <div><label class="block text-xs text-gray-500 mb-1">Hasta</label><input id="hasta" type="date" class="bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm"></div>
      <button onclick="cargarResumen()" class="bg-neon text-black font-bold rounded-lg px-4 py-2 text-sm">Filtrar</button>
    </div>

    <!-- KPIs -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-3"><p class="text-gray-500 text-xs">Visitas</p><p id="kpi-visitas" class="text-white font-bold text-xl">0</p></div>
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-3"><p class="text-gray-500 text-xs">Ventas $</p><p id="kpi-ventas" class="text-neon font-bold text-xl">$ 0</p></div>
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-3"><p class="text-gray-500 text-xs">Cant. ventas</p><p id="kpi-cant" class="text-white font-bold text-xl">0</p></div>
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-3"><p class="text-gray-500 text-xs">Pedidos pend.</p><p id="kpi-pedidos" class="text-orange-400 font-bold text-xl">0</p></div>
    </div>

    <!-- Lista de clientes con ubicación -->
    <h3 class="font-bold text-sm text-gray-400 mb-2">Clientes (<span id="cont-cli">0</span>)</h3>
    <div id="lista-clientes" class="space-y-2"></div>
  </div>

<script>
  const API_URL = '/api';

  async function cargarResumen(){
    var q = [];
    var d = document.getElementById('desde').value, h = document.getElementById('hasta').value;
    if (d) q.push('desde='+d); if (h) q.push('hasta='+h);
    try {
      var r = await fetch(API_URL+'/reparto/resumen'+(q.length?'?'+q.join('&'):''), {cache:'no-store'}).then(x=>x.json());
      document.getElementById('kpi-visitas').textContent = r.visitas||0;
      document.getElementById('kpi-ventas').textContent = '$ ' + (r.ventas_total||0).toLocaleString('es-AR');
      document.getElementById('kpi-cant').textContent = r.ventas_cantidad||0;
      document.getElementById('kpi-pedidos').textContent = r.pedidos_pendientes||0;
    } catch(e){}
  }

  async function cargarClientes(){
    var cont = document.getElementById('lista-clientes');
    try {
      var cl = await fetch(API_URL+'/reparto/clientes', {cache:'no-store'}).then(r=>r.json());
      document.getElementById('cont-cli').textContent = cl.length;
      if (!cl.length){ cont.innerHTML='<p class="text-gray-600 text-sm">Sin clientes cargados.</p>'; return; }
      cont.innerHTML = '';
      cl.forEach(function(c){
        var tel = (c.telefono||'').replace(/[^0-9]/g,''); if(tel && !tel.startsWith('54')) tel='54'+tel;
        var mapa = (c.latitud&&c.longitud) ? 'https://www.google.com/maps/search/?api=1&query='+c.latitud+','+c.longitud : (c.direccion?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.direccion):null);
        cont.innerHTML +=
          '<div class="bg-gray-900 border border-gray-800 rounded-lg p-3 flex items-center gap-3">' +
            (c.foto_url?'<img src="'+c.foto_url+'" class="w-12 h-12 rounded-lg object-cover flex-shrink-0">':'<div class="w-12 h-12 rounded-lg bg-gray-800 flex items-center justify-center flex-shrink-0">🏪</div>') +
            '<div class="min-w-0 flex-1"><p class="font-bold text-white truncate">'+c.nombre+'</p>' +
              '<p class="text-gray-500 text-xs truncate">'+(c.direccion||'')+'</p>' +
              '<p class="text-gray-600 text-xs">Comprado: '+ ('$ '+(parseFloat(c.total_comprado)||0).toLocaleString('es-AR')) +' · '+(c.ultima_visita?('últ. '+c.ultima_visita.slice(0,10)):'sin visitas')+'</p>' +
            '</div>' +
            '<div class="flex flex-col gap-1 flex-shrink-0">' +
              (tel?'<a href="https://wa.me/'+tel+'" target="_blank" class="text-xs text-green-400 border border-green-800 rounded px-2 py-1">📲</a>':'') +
              (mapa?'<a href="'+mapa+'" target="_blank" class="text-xs text-blue-400 border border-blue-800 rounded px-2 py-1">🗺️</a>':'') +
            '</div>' +
          '</div>';
      });
    } catch(e){ cont.innerHTML='<p class="text-red-400 text-sm">No se pudieron cargar (¿falta el SQL?).</p>'; }
  }

  cargarResumen();
  cargarClientes();
</script>
</body>
</html>
