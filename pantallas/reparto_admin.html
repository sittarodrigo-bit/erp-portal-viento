<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reparto Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --neon: #e4fc74; }
  .text-neon { color: var(--neon); }
  .bg-neon { background-color: var(--neon); }
  body { background:#0a0a0a; }
  .tab-btn { padding: 10px 16px; font-size: 14px; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
  .tab-btn.active { border-bottom-color: var(--neon); color: var(--neon); }
</style>
</head>
<body class="text-white min-h-screen">
  <header class="border-b border-gray-800 px-4 py-3 flex justify-between items-center sticky top-0 bg-black z-30">
    <h1 class="font-bold text-lg">👨‍💼 Reparto Admin</h1>
    <button onclick="salirAdmin()" class="border border-gray-700 text-gray-400 rounded-lg px-3 py-2 text-sm">Salir</button>
  </header>

  <div class="border-b border-gray-800 px-4 flex gap-2 bg-gray-950">
    <button class="tab-btn active" onclick="switchTab('clientes')">👥 Clientes</button>
    <button class="tab-btn" onclick="switchTab('ventas')">💰 Ventas</button>
    <button class="tab-btn" onclick="switchTab('pedidos')">📲 Pedidos catálogo</button>
    <button class="tab-btn" onclick="switchTab('catalogo')">🎨 Catálogo</button>
    <button class="tab-btn" onclick="switchTab('margenes')">⚙️ Márgenes</button>
  </div>

  <div class="p-4">
    <!-- TAB: Clientes -->
    <div id="tab-clientes" class="block">
      <div class="flex gap-2 mb-4">
        <input id="filtro-vendedor-cl" onchange="renderClientes()" placeholder="Filtrar vendedor..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
        <input id="buscar-cliente" oninput="renderClientes()" placeholder="🔍 Buscar..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
      </div>
      <div id="lista-clientes-admin" class="space-y-2"></div>
    </div>

    <!-- TAB: Ventas -->
    <div id="tab-ventas" class="hidden">
      <div class="flex gap-2 mb-4">
        <input id="filtro-vendedor" onchange="renderVentas()" placeholder="Filtrar vendedor..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
        <select id="filtro-estado" onchange="renderVentas()" class="bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
          <option value="">— Todos los estados —</option>
          <option value="pendiente">Pendiente</option>
          <option value="entregado">Entregado</option>
        </select>
      </div>
      <div id="lista-ventas-admin" class="space-y-2"></div>
    </div>

    <!-- TAB: Pedidos catálogo -->
    <div id="tab-pedidos" class="hidden">
      <div class="flex gap-2 mb-4">
        <select id="filtro-vendedor-ped" onchange="renderPedidos()" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
          <option value="">— Todos los vendedores —</option>
        </select>
        <select id="filtro-estado-ped" onchange="renderPedidos()" class="bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
          <option value="">— Todos los estados —</option>
          <option value="nuevo">Nuevo</option>
          <option value="contactado">Contactado</option>
          <option value="confirmado">Confirmado</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
      <div id="lista-pedidos-admin" class="space-y-2"></div>
    </div>

    <!-- TAB: Catálogo (control de visibilidad) -->
    <div id="tab-catalogo" class="hidden">
      <div class="mb-4">
        <label class="block text-sm text-gray-500 mb-2">📦 Seleccionar vendedor</label>
        <select id="filtro-catalogo-vendedor" onchange="renderCatalogoProducts()" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm">
          <option value="">— Todos los vendedores —</option>
        </select>
      </div>
      <div class="bg-gray-900 border border-gray-700 rounded-xl p-4">
        <h3 class="font-bold mb-3">Productos en catálogo</h3>
        <p class="text-gray-500 text-xs mb-3">Marca los productos que querés mostrar en el catálogo público. Podés reordenarlos por número.</p>
        <div id="lista-catalogo-productos" class="space-y-2"></div>
      </div>
    </div>

    <!-- TAB: Márgenes -->
    <div id="tab-margenes" class="hidden">
      <div class="bg-gray-900 border border-gray-700 rounded-xl p-4">
        <h3 class="font-bold mb-3">Márgenes por vendedor (sesiones activas)</h3>
        <div id="lista-margenes" class="space-y-2"></div>
      </div>
    </div>
  </div>

  <!-- Modal detalle pedido -->
  <div id="modal-pedido-detalle" class="hidden fixed inset-0 bg-black/90 z-40 overflow-y-auto p-4">
    <div class="max-w-md mx-auto bg-gray-900 border border-gray-700 rounded-xl p-4 mt-4">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold">Pedido #<span id="ped-id">0</span></h3>
        <button onclick="cerrarPedido()" class="text-gray-500 text-2xl">×</button>
      </div>
      <div class="bg-gray-800 rounded-lg p-3 mb-3 space-y-1 text-sm">
        <p><span class="text-gray-500">Cliente:</span> <strong id="ped-cliente">—</strong></p>
        <p><span class="text-gray-500">Teléfono:</span> <strong id="ped-tel">—</strong></p>
        <p><span class="text-gray-500">Fecha:</span> <strong id="ped-fecha">—</strong></p>
        <p><span class="text-gray-500">Estado:</span> <strong id="ped-estado">—</strong></p>
      </div>
      <h4 class="text-xs font-bold text-gray-500 mb-2">Productos</h4>
      <div id="ped-items" class="space-y-1 text-xs mb-3"></div>
      <p class="text-right text-sm font-bold mb-3">Total: <span class="text-neon" id="ped-total">$ 0</span></p>
      <div class="flex gap-2">
        <select id="ped-estado-sel" class="flex-1 bg-black border border-gray-700 rounded-lg p-2 text-sm">
          <option value="nuevo">Nuevo</option>
          <option value="contactado">Contactado</option>
          <option value="confirmado">Confirmado</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <button onclick="actualizarEstadoPedido()" class="flex-1 bg-neon text-black font-bold rounded-lg px-3 text-sm">Guardar</button>
      </div>
      <button onclick="cerrarPedido()" class="w-full border border-gray-700 text-gray-400 rounded-lg py-2 text-sm mt-2">Cerrar</button>
    </div>
  </div>

<script>
  const API_URL = '/api';
  let clientes = [];
  let ventas = [];
  let pedidos = [];
  let currentTab = 'clientes';
  let currentPedidoId = null;

  function fmt(n){ return '$ ' + (Math.round((parseFloat(n)||0)*100)/100).toLocaleString('es-AR'); }

  function switchTab(tab){
    currentTab = tab;
    ['clientes','ventas','pedidos','catalogo','margenes'].forEach(t => {
      document.getElementById('tab-'+t).classList[t===tab?'remove':'add']('hidden');
      document.querySelector('[onclick="switchTab(\''+t+'\')"]').classList[t===tab?'add':'remove']('active');
    });
    if (tab==='clientes') renderClientes();
    else if (tab==='ventas') renderVentas();
    else if (tab==='pedidos') renderPedidos();
    else if (tab==='catalogo') cargarVendedoresParaCatalogo();
    else if (tab==='margenes') renderMargenes();
  }

  function salirAdmin(){ window.location.href = '/reparto-admin-login'; }

  async function cargarClientes(){
    try { clientes = await fetch(API_URL+'/reparto/clientes', {cache:'no-store'}).then(r=>r.json()); } catch(e){ clientes = []; }
  }

  async function cargarVentas(){
    try { ventas = await fetch(API_URL+'/reparto/ventas', {cache:'no-store'}).then(r=>r.json()); } catch(e){ ventas = []; }
  }

  async function cargarPedidos(){
    try { 
      pedidos = await fetch(API_URL+'/catalogo-pedidos', {cache:'no-store'}).then(r=>r.json());
      var sel = document.getElementById('filtro-vendedor-ped');
      sel.innerHTML = '<option value="">— Todos los vendedores —</option>';
    } catch(e){ pedidos = []; }
  }

  function renderClientes(){
    cargarClientes().then(() => {
      var cont = document.getElementById('lista-clientes-admin');
      var filt_vend = (document.getElementById('filtro-vendedor-cl').value||'').toLowerCase();
      var busca = (document.getElementById('buscar-cliente').value||'').toLowerCase();
      var filtrados = clientes.filter(c => {
        return (c.nombre||'').toLowerCase().includes(busca) && 
               (filt_vend==='' || (c.nombre_vendedor||'').toLowerCase().includes(filt_vend));
      });
      cont.innerHTML = '';
      if (!filtrados.length){ cont.innerHTML='<p class="text-gray-600 text-sm">Sin clientes.</p>'; return; }
      filtrados.slice(0,200).forEach(c => {
        var div = document.createElement('div');
        div.className = 'bg-gray-900 border border-gray-800 rounded-lg p-3 hover:border-neon';
        div.innerHTML =
          '<div class="flex justify-between items-start">' +
            '<div class="flex-1"><p class="font-bold">'+c.nombre+'</p>' +
              '<p class="text-gray-500 text-xs">'+c.localidad+(c.telefono?' · '+c.telefono:'')+'</p>' +
              '<p class="text-gray-600 text-xs">👤 '+(c.nombre_vendedor||'Sin vendedor')+' • '+fmt(c.total_comprado||0)+'</p></div>' +
          '</div>';
        cont.appendChild(div);
      });
    });
  }

  function renderVentas(){
    cargarVentas().then(() => {
      var cont = document.getElementById('lista-ventas-admin');
      var filt_vend = (document.getElementById('filtro-vendedor').value||'').toLowerCase();
      var filt_estado = document.getElementById('filtro-estado').value||'';
      var filtrados = ventas.filter(v => {
        return (filt_vend==='' || (v.nombre_vendedor||'').toLowerCase().includes(filt_vend)) &&
               (filt_estado==='' || v.estado===filt_estado);
      });
      cont.innerHTML = '';
      if (!filtrados.length){ cont.innerHTML='<p class="text-gray-600 text-sm">Sin ventas.</p>'; return; }
      filtrados.slice(0,200).forEach(v => {
        var estado_cls = v.estado==='entregado' ? 'text-green-400' : 'text-yellow-400';
        var div = document.createElement('div');
        div.className = 'bg-gray-900 border border-gray-800 rounded-lg p-3 hover:border-neon';
        div.innerHTML =
          '<div class="flex justify-between">' +
            '<div><p class="font-bold">#'+String(v.id).padStart(5,'0')+' · '+v.cliente_nombre+'</p>' +
              '<p class="text-gray-500 text-xs">👤 '+(v.nombre_vendedor||'—')+' • '+v.tipo+' • '+(v.fecha||'').slice(0,10)+'</p></div>' +
            '<div class="text-right"><p class="font-bold">'+fmt(v.total)+'</p>' +
              '<p class="'+estado_cls+' text-xs">'+(v.estado||'pendiente')+'</p></div>' +
          '</div>';
        cont.appendChild(div);
      });
    });
  }

  function renderPedidos(){
    cargarPedidos().then(() => {
      var cont = document.getElementById('lista-pedidos-admin');
      var filt_vend = parseInt(document.getElementById('filtro-vendedor-ped').value||0) || null;
      var filt_estado = document.getElementById('filtro-estado-ped').value||'';
      var filtrados = pedidos.filter(p => {
        return (!filt_vend || p.id_vendedor===filt_vend) &&
               (filt_estado==='' || p.estado===filt_estado);
      });
      cont.innerHTML = '';
      if (!filtrados.length){ cont.innerHTML='<p class="text-gray-600 text-sm">Sin pedidos.</p>'; return; }
      filtrados.slice(0,200).forEach(p => {
        var estado_color = p.estado==='nuevo' ? 'bg-red-900' : (p.estado==='confirmado' ? 'bg-green-900' : 'bg-gray-800');
        var div = document.createElement('div');
        div.className = 'bg-gray-900 border border-gray-800 rounded-lg p-3 cursor-pointer hover:border-neon ' + estado_color;
        div.innerHTML =
          '<div class="flex justify-between">' +
            '<div><p class="font-bold">#'+String(p.id).padStart(5,'0')+' · '+p.cliente_nombre+'</p>' +
              '<p class="text-gray-500 text-xs">📲 '+p.cliente_telefono+'</p></div>' +
            '<p class="font-bold">'+fmt(p.total)+'</p>' +
          '</div>';
        div.onclick = () => abrirPedidoDetalle(p);
        cont.appendChild(div);
      });
    });
  }

  async function renderMargenes(){
    try {
      var resp = await fetch(API_URL+'/reparto/margenes', {cache:'no-store'}).then(r=>r.json());
      var cont = document.getElementById('lista-margenes');
      cont.innerHTML = '';
      if (!resp.length){ cont.innerHTML='<p class="text-gray-600">Sin vendedores activos.</p>'; return; }
      resp.forEach(v => {
        var div = document.createElement('div');
        div.className = 'flex justify-between items-center bg-gray-800 rounded-lg p-3 border border-gray-700';
        div.innerHTML =
          '<div><p class="font-bold">'+v.nombre+' '+v.apellido+'</p><p class="text-gray-500 text-xs">Sesión activa</p></div>' +
          '<p class="text-neon font-bold text-lg">'+(v.margen||'—')+'%</p>';
        cont.appendChild(div);
      });
    } catch(e){ document.getElementById('lista-margenes').innerHTML='<p class="text-gray-600">—</p>'; }
  }

  function abrirPedidoDetalle(p){
    currentPedidoId = p.id;
    document.getElementById('ped-id').textContent = String(p.id).padStart(5,'0');
    document.getElementById('ped-cliente').textContent = p.cliente_nombre;
    document.getElementById('ped-tel').textContent = p.cliente_telefono;
    document.getElementById('ped-fecha').textContent = (p.fecha||'').slice(0,16).replace('T',' ');
    document.getElementById('ped-estado').textContent = p.estado;
    document.getElementById('ped-estado-sel').value = p.estado;
    document.getElementById('ped-total').textContent = fmt(p.total);
    var items_cont = document.getElementById('ped-items');
    items_cont.innerHTML = '';
    try {
      var items = JSON.parse(p.items_json || '[]');
      items.forEach(i => {
        var fila = document.createElement('div');
        fila.className = 'flex justify-between text-gray-400 border-b border-gray-700 py-1';
        fila.innerHTML = '<span>'+i.cantidad+'× '+i.nombre+'</span><span>$ '+(parseFloat(i.precio)*i.cantidad).toFixed(2)+'</span>';
        items_cont.appendChild(fila);
      });
    } catch(e){}
    document.getElementById('modal-pedido-detalle').classList.remove('hidden');
  }

  function cerrarPedido(){ document.getElementById('modal-pedido-detalle').classList.add('hidden'); }

  async function actualizarEstadoPedido(){
    var estado = document.getElementById('ped-estado-sel').value;
    try {
      await fetch(API_URL+'/catalogo-pedidos/'+currentPedidoId+'/estado', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ estado: estado })});
      alert('✓ Actualizado');
      cerrarPedido();
      renderPedidos();
    } catch(e){ alert('Error.'); }
  }

  // ===== CATÁLOGO =====
  async function cargarVendedoresParaCatalogo(){
    try {
      var resp = await fetch(API_URL+'/reparto/empleados', {cache:'no-store'}).then(r=>r.json()).catch(e => []);
      var sel = document.getElementById('filtro-catalogo-vendedor');
      sel.innerHTML = '<option value="">— Todos los vendedores —</option>';
      (resp || []).forEach(e => {
        sel.innerHTML += '<option value="'+e.id+'">'+e.nombre+' '+e.apellido+'</option>';
      });
    } catch(e){}
  }

  async function renderCatalogoProducts(){
    var id_vend = parseInt(document.getElementById('filtro-catalogo-vendedor').value||0) || null;
    if (!id_vend){ alert('Selecciona un vendedor.'); return; }
    
    try {
      var productos = await fetch(API_URL+'/catalogo/'+id_vend+'/productos-admin', {cache:'no-store'}).then(r=>r.json());
      var cont = document.getElementById('lista-catalogo-productos');
      cont.innerHTML = '';
      
      productos.forEach(p => {
        var div = document.createElement('div');
        div.className = 'bg-gray-800 border border-gray-700 rounded-lg p-3 flex items-center gap-3';
        div.innerHTML =
          '<input type="checkbox" id="vis-'+p.id+'" '+( p.visible ? 'checked' : '')+' onchange="toggleProductoVisible('+id_vend+','+p.id+',this.checked)" class="w-4 h-4">' +
          '<div class="flex-1"><p class="text-sm font-bold">'+p.nombre+'</p><p class="text-xs text-gray-500">$ '+parseFloat(p.precio_mayorista||0).toFixed(2)+'</p></div>' +
          '<input type="number" min="0" value="'+(p.orden||0)+'" onchange="cambiarOrden('+id_vend+','+p.id+',this.value)" placeholder="Orden" class="w-16 bg-black border border-gray-700 rounded px-2 py-1 text-xs">';
        cont.appendChild(div);
      });
    } catch(e){
      document.getElementById('lista-catalogo-productos').innerHTML = '<p class="text-red-400">Error cargando.</p>';
    }
  }

  async function toggleProductoVisible(id_vend, id_prod, visible){
    try {
      await fetch(API_URL+'/catalogo/'+id_vend+'/productos/'+id_prod+'/visible', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ visible: visible })
      });
    } catch(e){ alert('Error.'); }
  }

  async function cambiarOrden(id_vend, id_prod, orden){
    try {
      await fetch(API_URL+'/catalogo/'+id_vend+'/productos/'+id_prod+'/visible', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ visible: true, orden: parseInt(orden)||0 })
      });
    } catch(e){ alert('Error.'); }
  }

  cargarClientes();
  cargarVentas();
  cargarPedidos();
</script>
</body>
</html>
