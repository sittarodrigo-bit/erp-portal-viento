<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>el gordo motoneta</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --neon: #e4fc74; }
  .text-neon { color: var(--neon); }
  .bg-neon { background-color: var(--neon); }
  .border-neon { border-color: var(--neon); }
  body { background:#0a0a0a; }
  .tab-activa { background:var(--neon); color:#000; }
</style>
</head>
<body class="text-white min-h-screen">
  <header class="border-b border-gray-800 px-4 py-3 flex justify-between items-center sticky top-0 bg-black z-20">
    <div>
      <h1 class="font-bold text-lg">Emprendimiento</h1>
      <p class="text-gray-500 text-xs">Hola, <span id="nombre-usuario">—</span></p>
    </div>
    <button onclick="salir()" class="text-xs text-gray-400 hover:text-white border border-gray-700 rounded px-3 py-1.5">Salir</button>
  </header>

  <!-- KPIs -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 p-4">
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-3">
      <p class="text-gray-500 text-xs">Saldo en caja</p>
      <p id="kpi-caja" class="text-neon font-bold text-xl">$ 0</p>
    </div>
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-3">
      <p class="text-gray-500 text-xs">Resultado (cobros − gastos)</p>
      <p id="kpi-resultado" class="text-white font-bold text-xl">$ 0</p>
    </div>
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-3">
      <p class="text-gray-500 text-xs">Aportes</p>
      <p id="kpi-aportes" class="text-blue-300 font-bold text-xl">$ 0</p>
    </div>
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-3">
      <p class="text-gray-500 text-xs">Reparto 50/50 c/u</p>
      <p id="kpi-reparto" class="text-purple-300 font-bold text-xl">$ 0</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="flex gap-2 px-4 mb-3">
    <button onclick="mostrarTab('mercaderia')" id="tab-mercaderia" class="tab-activa font-bold rounded-lg px-4 py-2 text-sm">📦 Mercadería</button>
    <button onclick="mostrarTab('dinero')" id="tab-dinero" class="bg-gray-800 text-gray-300 font-bold rounded-lg px-4 py-2 text-sm">💵 Dinero</button>
  </div>

  <!-- ── SECCIÓN MERCADERÍA ── -->
  <div id="sec-mercaderia" class="px-4 pb-24">
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 mb-4">
      <h3 class="font-bold text-sm mb-3">Registrar movimiento de mercadería</h3>
      <div class="grid grid-cols-2 gap-2 mb-2">
        <select id="m-item" class="bg-black border border-gray-700 rounded-lg p-2 text-sm col-span-2"></select>
        <select id="m-tipo" class="bg-black border border-gray-700 rounded-lg p-2 text-sm">
          <option value="entrada">Entrada (+)</option>
          <option value="salida">Salida (−)</option>
        </select>
        <input id="m-cantidad" type="number" step="0.001" placeholder="Cantidad" class="bg-black border border-gray-700 rounded-lg p-2 text-sm">
        <input id="m-fecha" type="date" class="bg-black border border-gray-700 rounded-lg p-2 text-sm">
        <input id="m-detalle" placeholder="Detalle (opcional)" class="bg-black border border-gray-700 rounded-lg p-2 text-sm">
      </div>
      <div class="flex gap-2">
        <button onclick="guardarMercaderia()" class="bg-neon text-black font-bold rounded-lg px-4 py-2 text-sm flex-1">Registrar</button>
        <button onclick="abrirNuevoItem()" class="border border-gray-700 text-gray-300 rounded-lg px-3 py-2 text-sm">+ Ítem</button>
      </div>
    </div>

    <h3 class="font-bold text-sm mb-2 text-gray-400">Stock actual</h3>
    <div id="lista-stock" class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-4"></div>

    <h3 class="font-bold text-sm mb-2 text-gray-400">Últimos movimientos</h3>
    <div id="lista-mov-merc" class="space-y-2"></div>
  </div>

  <!-- ── SECCIÓN DINERO ── -->
  <div id="sec-dinero" class="px-4 pb-24 hidden">
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 mb-4">
      <h3 class="font-bold text-sm mb-3">Registrar movimiento de dinero</h3>
      <div class="grid grid-cols-2 gap-2 mb-2">
        <select id="d-tipo" class="bg-black border border-gray-700 rounded-lg p-2 text-sm">
          <option value="cobro">Cobro / Venta (+)</option>
          <option value="gasto">Gasto (−)</option>
          <option value="aporte">Aporte de capital (+)</option>
        </select>
        <input id="d-monto" type="number" step="0.01" placeholder="Monto $" class="bg-black border border-gray-700 rounded-lg p-2 text-sm">
        <input id="d-concepto" placeholder="Concepto" class="bg-black border border-gray-700 rounded-lg p-2 text-sm col-span-2">
        <input id="d-fecha" type="date" class="bg-black border border-gray-700 rounded-lg p-2 text-sm col-span-2">
      </div>
      <button onclick="guardarDinero()" class="bg-neon text-black font-bold rounded-lg px-4 py-2 text-sm w-full">Registrar</button>
    </div>

    <h3 class="font-bold text-sm mb-2 text-gray-400">Últimos movimientos</h3>
    <div id="lista-mov-din" class="space-y-2"></div>
  </div>

  <!-- Modal nuevo ítem -->
  <div id="modal-item" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-30 p-4">
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 w-full max-w-sm">
      <h3 class="font-bold mb-3">Nuevo ítem</h3>
      <input id="ni-nombre" placeholder="Nombre" class="w-full bg-black border border-gray-700 rounded-lg p-2 text-sm mb-2">
      <div class="grid grid-cols-2 gap-2 mb-3">
        <select id="ni-tipo" class="bg-black border border-gray-700 rounded-lg p-2 text-sm">
          <option value="insumo">Insumo / Materia prima</option>
          <option value="terminado">Producto terminado</option>
        </select>
        <input id="ni-unidad" placeholder="Unidad (kg, unidad...)" value="unidad" class="bg-black border border-gray-700 rounded-lg p-2 text-sm">
      </div>
      <div class="flex gap-2">
        <button onclick="cerrarNuevoItem()" class="flex-1 border border-gray-600 text-gray-300 rounded-lg py-2 text-sm">Cancelar</button>
        <button onclick="guardarNuevoItem()" class="flex-1 bg-neon text-black font-bold rounded-lg py-2 text-sm">Crear</button>
      </div>
    </div>
  </div>

<script>
  const API_URL = '/api';
  let usuario = null;
  let itemsCache = [];

  function fmt(n){ return '$ ' + (parseFloat(n)||0).toLocaleString('es-AR'); }
  function hoy(){ return new Date().toISOString().slice(0,10); }

  // Verificar sesión
  try { usuario = JSON.parse(sessionStorage.getItem('tercero_usuario')); } catch(e){}
  if (!usuario || !usuario.id) { window.location.href = '/tercero-login'; }
  else { document.getElementById('nombre-usuario').textContent = usuario.nombre; }

  function salir(){ sessionStorage.removeItem('tercero_usuario'); window.location.href='/tercero-login'; }

  function mostrarTab(t){
    document.getElementById('sec-mercaderia').classList.toggle('hidden', t!=='mercaderia');
    document.getElementById('sec-dinero').classList.toggle('hidden', t!=='dinero');
    document.getElementById('tab-mercaderia').className = t==='mercaderia' ? 'tab-activa font-bold rounded-lg px-4 py-2 text-sm' : 'bg-gray-800 text-gray-300 font-bold rounded-lg px-4 py-2 text-sm';
    document.getElementById('tab-dinero').className = t==='dinero' ? 'tab-activa font-bold rounded-lg px-4 py-2 text-sm' : 'bg-gray-800 text-gray-300 font-bold rounded-lg px-4 py-2 text-sm';
  }

  async function cargarTodo(){
    await cargarItems();
    await cargarMovMerc();
    await cargarMovDin();
    await cargarResumen();
  }

  async function cargarResumen(){
    const r = await fetch(API_URL+'/tercero/resumen', {cache:'no-store'}).then(x=>x.json());
    document.getElementById('kpi-caja').textContent = fmt(r.saldo_caja);
    document.getElementById('kpi-resultado').textContent = fmt(r.resultado);
    document.getElementById('kpi-resultado').className = 'font-bold text-xl ' + (r.resultado>=0?'text-neon':'text-red-400');
    document.getElementById('kpi-aportes').textContent = fmt(r.aportes);
    document.getElementById('kpi-reparto').textContent = fmt(r.reparto_50);
  }

  async function cargarItems(){
    itemsCache = await fetch(API_URL+'/tercero/items', {cache:'no-store'}).then(x=>x.json());
    const sel = document.getElementById('m-item');
    sel.innerHTML = itemsCache.length ? '' : '<option value="">(creá un ítem primero)</option>';
    itemsCache.forEach(function(i){
      const o = document.createElement('option'); o.value = i.id;
      o.textContent = i.nombre + ' (' + i.unidad + ')';
      sel.appendChild(o);
    });
    // Stock
    const cont = document.getElementById('lista-stock');
    cont.innerHTML = '';
    if (!itemsCache.length){ cont.innerHTML='<p class="text-gray-600 text-sm col-span-full">Sin ítems todavía.</p>'; }
    itemsCache.forEach(function(i){
      const bajo = parseFloat(i.stock) <= 0;
      cont.innerHTML += '<div class="bg-gray-900 border '+(bajo?'border-red-800':'border-gray-800')+' rounded-lg p-2">'+
        '<p class="text-xs text-gray-500">'+i.nombre+'</p>'+
        '<p class="font-bold '+(bajo?'text-red-400':'text-white')+'">'+parseFloat(i.stock).toLocaleString('es-AR')+' <span class="text-xs text-gray-500">'+i.unidad+'</span></p>'+
        '</div>';
    });
  }

  async function cargarMovMerc(){
    const m = await fetch(API_URL+'/tercero/mercaderia', {cache:'no-store'}).then(x=>x.json());
    const c = document.getElementById('lista-mov-merc');
    c.innerHTML = m.length ? '' : '<p class="text-gray-600 text-sm">Sin movimientos.</p>';
    m.forEach(function(x){
      const signo = x.tipo==='entrada' ? '+' : '−';
      const col = x.tipo==='entrada' ? 'text-green-400' : 'text-orange-400';
      c.innerHTML += '<div class="bg-gray-900 border border-gray-800 rounded-lg px-3 py-2 flex justify-between items-center">'+
        '<div><p class="text-sm text-white">'+x.item+' <span class="'+col+' font-bold">'+signo+parseFloat(x.cantidad).toLocaleString('es-AR')+' '+x.unidad+'</span></p>'+
        '<p class="text-xs text-gray-600">'+x.fecha+(x.detalle?' · '+x.detalle:'')+(x.usuario?' · '+x.usuario:'')+'</p></div>'+
        '</div>';
    });
  }

  async function cargarMovDin(){
    const d = await fetch(API_URL+'/tercero/dinero', {cache:'no-store'}).then(x=>x.json());
    const c = document.getElementById('lista-mov-din');
    c.innerHTML = d.length ? '' : '<p class="text-gray-600 text-sm">Sin movimientos.</p>';
    const etiq = {cobro:'Cobro', gasto:'Gasto', aporte:'Aporte'};
    const col  = {cobro:'text-green-400', gasto:'text-red-400', aporte:'text-blue-300'};
    const signo= {cobro:'+', gasto:'−', aporte:'+'};
    d.forEach(function(x){
      c.innerHTML += '<div class="bg-gray-900 border border-gray-800 rounded-lg px-3 py-2 flex justify-between items-center">'+
        '<div><p class="text-sm text-white">'+x.concepto+'</p>'+
        '<p class="text-xs text-gray-600">'+etiq[x.tipo]+' · '+x.fecha+(x.usuario?' · '+x.usuario:'')+'</p></div>'+
        '<span class="'+col[x.tipo]+' font-bold">'+signo[x.tipo]+fmt(x.monto).replace('$ ','$')+'</span>'+
        '</div>';
    });
  }

  async function guardarMercaderia(){
    const id_item = document.getElementById('m-item').value;
    const tipo = document.getElementById('m-tipo').value;
    const cantidad = parseFloat(document.getElementById('m-cantidad').value);
    if (!id_item){ alert('Elegí un ítem (o creá uno con "+ Ítem").'); return; }
    if (!cantidad || cantidad<=0){ alert('Poné una cantidad válida.'); return; }
    const res = await fetch(API_URL+'/tercero/mercaderia', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id_item, tipo, cantidad, fecha: document.getElementById('m-fecha').value||null, detalle: document.getElementById('m-detalle').value, id_usuario: usuario.id })
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); alert('Error: '+(e.detail||'')); return; }
    document.getElementById('m-cantidad').value=''; document.getElementById('m-detalle').value='';
    cargarItems(); cargarMovMerc(); cargarResumen();
  }

  async function guardarDinero(){
    const tipo = document.getElementById('d-tipo').value;
    const monto = parseFloat(document.getElementById('d-monto').value);
    const concepto = document.getElementById('d-concepto').value.trim();
    if (!concepto){ alert('Escribí un concepto.'); return; }
    if (!monto || monto<=0){ alert('Poné un monto válido.'); return; }
    const res = await fetch(API_URL+'/tercero/dinero', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ tipo, monto, concepto, fecha: document.getElementById('d-fecha').value||null, id_usuario: usuario.id })
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); alert('Error: '+(e.detail||'')); return; }
    document.getElementById('d-monto').value=''; document.getElementById('d-concepto').value='';
    cargarMovDin(); cargarResumen();
  }

  function abrirNuevoItem(){ document.getElementById('modal-item').classList.remove('hidden'); }
  function cerrarNuevoItem(){ document.getElementById('modal-item').classList.add('hidden'); }
  async function guardarNuevoItem(){
    const nombre = document.getElementById('ni-nombre').value.trim();
    if (!nombre){ alert('Poné un nombre.'); return; }
    const res = await fetch(API_URL+'/tercero/items', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ nombre, tipo: document.getElementById('ni-tipo').value, unidad: document.getElementById('ni-unidad').value.trim()||'unidad' })
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); alert('Error: '+(e.detail||'')); return; }
    document.getElementById('ni-nombre').value='';
    cerrarNuevoItem(); cargarItems();
  }

  // init
  document.getElementById('m-fecha').value = hoy();
  document.getElementById('d-fecha').value = hoy();
  cargarTodo();
</script>
</body>
</html>
