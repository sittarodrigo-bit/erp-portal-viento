<!DOCTYPE html>
<html lang="es">
<head>
<script>window.PANEL_ACTUAL = "armado";</script>
<script src="/static/auth.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armado de Pedidos | Portal del Viento</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{neon:'#d4ff3f'}}}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-200 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-black border-b border-gray-800 px-5 py-2.5 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <h1 class="text-neon font-bold text-base tracking-widest uppercase">Portal del Viento</h1>
      <span class="text-gray-600 text-sm">· Armado de pedidos</span>
    </div>
    <button onclick="cargarPedidos()" class="border border-gray-700 text-gray-300 hover:text-white px-3 py-1.5 rounded-lg text-sm">🔄 Actualizar</button>
  </header>

  <!-- Vista lista de pedidos -->
  <main id="vista-lista" class="p-4 max-w-5xl mx-auto">
    <div class="flex gap-2 mb-3 flex-wrap">
      <button onclick="cambiarTab('pendientes')" id="tab-pendientes" class="px-4 py-2 rounded-lg text-sm font-bold bg-neon text-black">📋 Por armar</button>
      <button onclick="cambiarTab('historial')" id="tab-historial" class="px-4 py-2 rounded-lg text-sm font-bold border border-gray-700 text-gray-300">📜 Historial</button>
      <button onclick="cambiarTab('stock')" id="tab-stock" class="px-4 py-2 rounded-lg text-sm font-bold border border-gray-700 text-gray-300">📦 Carga stock</button>
    </div>
    <div id="cont-pendientes">
      <div id="lista-pedidos" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <p class="text-gray-500 text-center py-10 col-span-full">Cargando...</p>
      </div>
    </div>
    <div id="cont-historial" class="hidden">
      <div id="lista-historial" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <p class="text-gray-500 text-center py-10 col-span-full">Cargando...</p>
      </div>
    </div>

    <!-- Tab carga de stock -->
    <div id="cont-stock" class="hidden max-w-lg mx-auto">
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 mb-4">
        <h2 class="text-white font-bold text-base mb-3">📦 Ingresar stock</h2>
        <input id="stock-buscar" type="text" placeholder="🔍 Buscar producto..." oninput="filtrarProductosStock()"
               class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg p-2.5 text-sm mb-3 outline-none">
        <div id="stock-lista" class="space-y-2 max-h-96 overflow-y-auto"></div>
      </div>
      <!-- Panel ingreso -->
      <div id="stock-ingreso-panel" class="hidden bg-gray-900 border border-neon rounded-xl p-4">
        <div class="flex justify-between items-start mb-3">
          <div>
            <p id="stock-prod-nombre" class="text-white font-bold text-base"></p>
            <p id="stock-prod-stock" class="text-gray-400 text-sm"></p>
          </div>
          <button onclick="cerrarIngreso()" class="text-gray-500 hover:text-white text-xl">✕</button>
        </div>
        <label class="block text-gray-400 text-xs mb-1 font-bold uppercase">Cantidad a ingresar</label>
        <input id="stock-cantidad" type="number" min="1" step="1" value="1"
               class="w-full bg-gray-800 border border-neon text-white rounded-lg p-3 text-xl font-bold mb-1 text-center outline-none">
        <label class="block text-gray-400 text-xs mb-3">Unidades (cajas, unidades, etc.)</label>
        <label class="block text-gray-400 text-xs mb-1 font-bold uppercase">Motivo <span class="text-gray-600 font-normal">(opcional)</span></label>
        <input id="stock-motivo" type="text" placeholder="Ej: producción 25/11, compra..."
               class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg p-2.5 text-sm mb-4 outline-none">
        <button id="btn-ingresar-stock" onclick="ingresarStock()"
                class="w-full bg-neon text-black font-black py-4 rounded-xl text-lg">✅ CONFIRMAR INGRESO</button>
        <div id="stock-estado" class="text-center text-sm mt-2 min-h-5"></div>
      </div>
    </div>
  </main>

  <!-- Vista detalle / armado -->
  <main id="vista-armado" class="hidden p-4 max-w-5xl mx-auto pb-32">
    <button onclick="volverLista()" class="text-gray-400 hover:text-white text-sm mb-3">← Volver a la lista</button>
    <div class="bg-black border border-gray-800 rounded-xl p-4 mb-3">
      <div class="flex justify-between items-center">
        <div class="flex items-baseline gap-3">
          <h2 id="arm-titulo" class="text-xl font-bold text-white"></h2>
          <p id="arm-distribuidor" class="text-neon font-bold text-sm"></p>
        </div>
        <div class="text-right">
          <span id="arm-estado-badge" class="text-gray-500 text-sm"></span>
        </div>
      </div>
      <div class="mt-2.5" id="arm-progreso-wrap">
        <div class="w-full bg-gray-900 rounded-full h-2 overflow-hidden">
          <div id="arm-progreso" class="bg-neon h-2 transition-all" style="width:0%"></div>
        </div>
        <p id="arm-progreso-txt" class="text-gray-500 text-xs mt-1.5"></p>
      </div>
    </div>

    <div id="arm-items" class="grid md:grid-cols-2 gap-2"></div>

    <!-- Barra inferior fija -->
    <div class="fixed bottom-0 left-0 right-0 bg-black border-t border-gray-800 p-3" id="arm-botonera">
      <div class="max-w-5xl mx-auto flex gap-2 flex-wrap">
        <div id="aviso-faltan" class="hidden w-full"></div>
        <button id="btn-parcial" onclick="marcarParcialListo()" class="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl text-sm">📦 Listo lo armado (parcial)</button>
        <button id="btn-listo" onclick="marcarTodo()" class="flex-1 bg-neon text-black font-bold py-3 rounded-xl text-base disabled:bg-gray-700 disabled:text-gray-500">✓ Todo listo</button>
        <button id="btn-guia" onclick="abrirModalGuia()" class="hidden w-full bg-blue-700 hover:bg-blue-600 text-white font-bold py-3 rounded-xl text-sm">🚚 Cargar guía de transporte</button>
        <!-- Botón despachar: visible solo cuando el pedido está en estado Preparado -->
        <button id="btn-despachar" onclick="abrirModalDespachar()" class="hidden w-full bg-green-700 hover:bg-green-600 text-white font-black py-4 rounded-xl text-base">🚚 DESPACHAR PEDIDO</button>
      </div>
    </div>
  </main>

  <!-- Modal Guía (edición simple, no despacho) -->
  <div id="modal-guia" class="hidden fixed inset-0 bg-black/80 flex items-end justify-center z-50 p-4">
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-white font-bold">🚚 Guía de transporte</h3>
        <button onclick="cerrarModalGuia()" class="text-gray-500 hover:text-white text-xl">✕</button>
      </div>
      <label class="block text-gray-400 text-xs mb-1">Transporte</label>
      <input id="guia-transporte" class="w-full bg-gray-800 border border-gray-700 text-white rounded p-2 mb-3 text-sm" placeholder="Ej: Andreani, Vía Cargo...">
      <label class="block text-gray-400 text-xs mb-1">Número de guía</label>
      <input id="guia-numero" class="w-full bg-gray-800 border border-gray-700 text-white rounded p-2 mb-4 text-sm" placeholder="Ej: 123456789">
      <button onclick="guardarGuia()" class="w-full bg-neon text-black font-bold py-2.5 rounded-xl">💾 Guardar</button>
    </div>
  </div>

  <!-- Modal Despachar (con foto de guía + WSP) -->
  <div id="modal-despachar" class="hidden fixed inset-0 bg-black/80 flex items-end justify-center z-50 p-4">
    <div class="bg-gray-900 border border-green-700 rounded-xl p-5 w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-white font-bold text-lg">🚚 Despachar pedido</h3>
        <button onclick="cerrarModalDespachar()" class="text-gray-500 hover:text-white text-xl">✕</button>
      </div>
      <!-- Info pedido -->
      <div id="desp-info" class="bg-gray-800 rounded-lg p-3 mb-4 text-sm text-gray-300"></div>
      <!-- Guía -->
      <label class="block text-gray-400 text-xs mb-1 font-bold uppercase">Transporte <span class="text-red-400">*</span></label>
      <input id="desp-transporte" class="w-full bg-gray-800 border border-gray-700 text-white rounded p-2 mb-3 text-sm" placeholder="Ej: Andreani, Vía Cargo...">
      <label class="block text-gray-400 text-xs mb-1 font-bold uppercase">Número de guía</label>
      <input id="desp-numero" class="w-full bg-gray-800 border border-gray-700 text-white rounded p-2 mb-4 text-sm" placeholder="Ej: 123456789">
      <!-- Foto de guía -->
      <label class="block text-gray-400 text-xs mb-2 font-bold uppercase">📷 Foto de la guía <span class="text-gray-500 font-normal">(opcional)</span></label>
      <div class="flex gap-2 mb-3">
        <button type="button" onclick="document.getElementById('desp-foto-input').click()" class="flex-1 bg-gray-800 border border-gray-700 text-gray-300 hover:text-white hover:border-gray-500 py-2 rounded-lg text-sm font-bold">📁 Galería</button>
        <button type="button" onclick="abrirCamara()" class="flex-1 bg-gray-800 border border-gray-700 text-gray-300 hover:text-white hover:border-gray-500 py-2 rounded-lg text-sm font-bold">📸 Cámara</button>
      </div>
      <input type="file" id="desp-foto-input" accept="image/*" class="hidden" onchange="procesarFotoGuia(this)">
      <!-- Preview foto -->
      <div id="desp-foto-preview" class="hidden mb-4 relative">
        <img id="desp-foto-img" class="w-full rounded-lg max-h-48 object-contain bg-gray-800" alt="Foto guía">
        <button onclick="quitarFotoGuia()" class="absolute top-1 right-1 bg-black/70 text-white rounded-full w-6 h-6 text-xs font-bold">✕</button>
      </div>
      <!-- WSP -->
      <div class="bg-green-900/30 border border-green-800 rounded-lg p-3 mb-3">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="desp-enviar-wsp" checked class="w-4 h-4 accent-green-500">
          <span class="text-green-300 text-sm font-bold">📱 Enviar WhatsApp al cliente</span>
        </label>
        <div id="desp-wsp-tel-wrap" class="mt-2">
          <input id="desp-tel" class="w-full bg-gray-800 border border-gray-700 text-white rounded p-2 text-sm" placeholder="Teléfono del cliente (ej: 2612074435)">
        </div>
        <label class="flex items-center gap-2 mt-2 cursor-pointer">
          <input type="checkbox" id="desp-adjuntar-comprobante" class="w-4 h-4 accent-purple-500">
          <span class="text-purple-300 text-sm">📋 Adjuntar comprobante interno (PDF)</span>
        </label>
      </div>
      <!-- Botón principal -->
      <button id="btn-confirmar-despacho" onclick="confirmarDespacho()" class="w-full bg-green-600 hover:bg-green-500 text-white font-black py-4 rounded-xl text-lg">✅ CONFIRMAR DESPACHO</button>
      <div id="desp-estado" class="text-center text-sm mt-2 min-h-5"></div>
    </div>
  </div>

<script>
const API_URL = window.location.origin + "/api";
const $ = id => document.getElementById(id);
const fmt = n => '$' + (parseFloat(n)||0).toLocaleString('es-AR');
let pedidoActual = null;
let armadoPor = null;

// Identificar quién arma (de la sesión del POS o producción, si existe)
try {
  var s = sessionStorage.getItem('pos_usuario') || sessionStorage.getItem('usuario_produccion') || localStorage.getItem('usuario');
  if (s) { var u = JSON.parse(s); armadoPor = (u.nombre || '') + ' ' + (u.apellido || ''); }
} catch(e) {}

async function cargarPedidos(){
  const cont = $('lista-pedidos');
  cont.innerHTML = '<p class="text-gray-500 text-center py-10">Cargando...</p>';
  try{
    const pedidos = await fetch(`${API_URL}/armado/pedidos`).then(r=>r.json());
    if(!pedidos.length){
      cont.innerHTML = '<div class="text-center py-16 text-gray-500"><div class="text-5xl mb-3">✅</div>No hay pedidos pendientes de armar.</div>';
      return;
    }
    cont.innerHTML = pedidos.map(p => {
      const enPrep = p.estado === 'En preparación';
      const parcial = p.estado === 'Despachado parcial';
      const preparado = p.estado === 'Preparado';
      const esRepo = p.tipo === 'reposicion';
      const borde = esRepo ? 'border-blue-700' : (preparado ? 'border-green-500' : (parcial ? 'border-orange-600' : (enPrep ? 'border-neon' : 'border-gray-800')));
      const badge = esRepo
        ? '<span class="text-xs font-bold px-2 py-1 rounded-full bg-blue-600/20 text-blue-300">🏪 Reposición local</span>'
        : (preparado
        ? '<span class="text-xs font-bold px-2 py-1 rounded-full bg-green-600/30 text-green-300 animate-pulse">🚚 LISTO — despachar</span>'
        : (parcial
        ? '<span class="text-xs font-bold px-2 py-1 rounded-full bg-orange-600/20 text-orange-400">📦 Parcial — completar</span>'
        : (enPrep ? '<span class="text-xs font-bold px-2 py-1 rounded-full bg-neon/20 text-neon">🛠️ En preparación</span>'
                  : '<span class="text-xs font-bold px-2 py-1 rounded-full bg-gray-800 text-gray-400">⏳ Pendiente</span>')));
      const titulo = esRepo ? ('Reposición #' + String(p.id).replace('r','')) : ('Pedido #' + p.id);
      const nombre = p.nombre || p.distribuidor || 'Sin nombre';
      const montoTxt = (p.total !== null && p.total !== undefined) ? ('<p class="text-neon font-bold">' + fmt(p.total) + '</p>') : '';
      return `<button onclick="abrirPedido('${p.id}')" class="text-left bg-gray-900 border ${borde} rounded-xl p-3 hover:border-gray-600 transition h-full">
        <div class="flex justify-between items-start gap-2">
          <div class="min-w-0">
            <p class="text-white font-bold">${titulo}</p>
            <p class="text-gray-400 text-sm truncate">${nombre}</p>
          </div>
          ${montoTxt ? '<div class="text-right shrink-0">'+montoTxt+'</div>' : ''}
        </div>
        <div class="mt-2">${badge}</div>
      </button>`;
    }).join('');
  }catch(e){
    cont.innerHTML = '<p class="text-red-400 text-center py-10 col-span-full">No se pudieron cargar los pedidos.</p>';
  }
}

async function abrirPedido(id){
  try{
    // Si está pendiente, iniciar preparación
    const det = await fetch(`${API_URL}/armado/pedidos/${id}`).then(r=>r.json());
    if(det.estado === 'Pendiente'){
      await fetch(`${API_URL}/armado/pedidos/${id}/iniciar`, {method:'PUT'});
      det.estado = 'En preparación';
    }
    pedidoActual = det;
    renderArmado();
    $('vista-lista').classList.add('hidden');
    $('vista-armado').classList.remove('hidden');
    window.scrollTo(0,0);
  }catch(e){ alert('No se pudo abrir el pedido.'); }
}

function renderArmado(){
  const d = pedidoActual;
  const esRepo = d.tipo === 'reposicion';
  $('arm-titulo').textContent = esRepo ? ('Reposición #' + String(d.id).replace('r','')) : ('Pedido #' + d.id);
  $('arm-distribuidor').textContent = d.distribuidor || 'Sin distribuidor';
  var badge = $('arm-estado-badge'); if (badge) badge.textContent = d.estado || '';

  var prog = document.getElementById('arm-progreso-wrap'); if(prog) prog.style.display='';
  var botonera = document.getElementById('arm-botonera'); if(botonera) botonera.style.display='';
  var estadoActual = d.estado || '';
  var estaPreparado = estadoActual === 'Preparado';

  // Botón despachar: solo cuando está Preparado (ya armado, listo para salir)
  var btnDespachar = $('btn-despachar');
  if(btnDespachar){
    btnDespachar.classList.toggle('hidden', esRepo || !estaPreparado);
  }
  // Botones listo/parcial: ocultos si ya está Preparado
  var btnListo = $('btn-listo');
  var btnParcial = $('btn-parcial');
  if(estaPreparado){
    if(btnListo) btnListo.classList.add('hidden');
    if(btnParcial) btnParcial.classList.add('hidden');
  }

  // Botón guía (edición rápida, sin despachar): solo si NO está preparado para despachar
  var btnGuia = $('btn-guia');
  if(btnGuia){
    var mostrarGuia = !esRepo && !estaPreparado && (estadoActual === 'Despachado' || estadoActual === 'Despachado parcial' || estadoActual === 'En preparación' || estadoActual === 'Terminado');
    btnGuia.classList.toggle('hidden', !mostrarGuia);
    btnGuia.textContent = (d.guia_transporte ? '✏️ Editar guía (' + d.guia_transporte + ')' : '🚚 Cargar guía de transporte');
  }

  const faltan = d.items.filter(i=>!i.completo);
  const hechos = d.items.filter(i=>i.completo);
  let html = '';
  if(esRepo){
    html += '<div class="bg-blue-900/20 border border-blue-800 rounded-xl p-3 mb-2 text-blue-200 text-sm col-span-full">🏪 Reposición de ' + (d.distribuidor||'local') + '. Cargá lo que vas preparando.</div>';
  }
  if(faltan.length){
    html += '<p class="text-orange-400 text-xs font-bold uppercase mb-1 mt-1 col-span-full">⬜ Falta completar (' + faltan.length + ')</p>';
    html += faltan.map(renderItem).join('');
  }
  if(hechos.length){
    html += '<p class="text-neon text-xs font-bold uppercase mb-1 mt-3 col-span-full">✓ Completos (' + hechos.length + ')</p>';
    html += hechos.map(renderItem).join('');
  }
  $('arm-items').innerHTML = html;
  actualizarProgreso();
}

function renderItem(it){
  const prep = it.preparado || 0;
  const completo = it.completo;
  const pctItem = it.cantidad ? Math.round(prep/it.cantidad*100) : 0;
  const idx = pedidoActual.items.indexOf(it);
  const esRepo = pedidoActual.tipo === 'reposicion';
  const esCaja = esRepo && it.es_caja && it.unidades_por_caja >= 2;
  const upc = it.unidades_por_caja || 12;
  // Stock disponible en el depósito de fábrica (en cajas si es caja, unidades si no)
  const stockDisp = esCaja ? (it.stock) : it.stock;  // it.stock ya viene en cajas para alfajores de fábrica
  const cantMostrar = esCaja ? (it.cantidad / upc) : it.cantidad;
  const prepMostrar = esCaja ? (prep / upc) : prep;
  const unidad = esCaja ? 'cajas' : '';
  const subinfo = esCaja ? `<p class="text-amber-400 text-xs">📦 ${cantMostrar} caja(s) × ${upc} = ${it.cantidad} unidades</p>` : '';
  // Stock disponible y proyectado
  const unidadCorta = esCaja ? 'cj' : 'u';
  const quedaria = stockDisp - prepMostrar;
  const colorStock = quedaria < 0 ? 'text-red-400' : (quedaria === 0 ? 'text-amber-400' : 'text-gray-400');
  const stockLinea = it.stock !== undefined && it.stock !== null
    ? `<p class="text-xs"><span class="text-gray-500">Depósito: </span><span class="text-white font-bold">${stockDisp} ${unidadCorta}</span> <span class="${colorStock}" id="queda-${idx}">→ quedarían ${quedaria} ${unidadCorta}</span></p>`
    : '';
  return `<div class="bg-gray-900 border ${completo?'border-neon/50 bg-neon/5':'border-gray-800'} rounded-xl p-3">
    <div class="flex items-center justify-between gap-2">
      <div class="flex-1 min-w-0">
        <p class="text-white font-bold text-sm">${it.nombre} ${completo?'<span class="text-neon">✓</span>':''}</p>
        <p class="text-gray-500 text-xs">Pedido: ${cantMostrar} ${unidad}</p>
        ${stockLinea}
        ${subinfo}
      </div>
      <div class="flex items-center gap-1.5 flex-shrink-0">
        <input type="number" inputmode="numeric" min="0" max="${cantMostrar}" value="${prepMostrar}"
               id="cant-${idx}"
               oninput="actualizarQueda(${idx})"
               onkeydown="if(event.key==='Enter'){setearCant(${idx})}"
               class="w-16 bg-black border border-gray-600 focus:border-neon text-white text-center text-lg font-bold rounded-lg py-1.5 outline-none">
        <span class="text-gray-600 text-xs">/ ${cantMostrar}${esCaja?' cj':''}</span>
        <button onclick="setearCant(${idx})" class="bg-neon text-black font-bold px-3 py-2 rounded-lg active:scale-95 text-sm">OK</button>
      </div>
    </div>
    <div class="w-full bg-gray-800 rounded-full h-1.5 mt-3 overflow-hidden"><div class="bg-neon h-1.5 transition-all" style="width:${pctItem}%"></div></div>
  </div>`;
}

// Actualiza el "quedarían X" en tiempo real mientras el empleado tipea (sin tocar la base)
function actualizarQueda(idx){
  const it = pedidoActual.items[idx];
  if(!it || it.stock === undefined || it.stock === null) return;
  const esRepo = pedidoActual.tipo === 'reposicion';
  const esCaja = esRepo && it.es_caja && it.unidades_por_caja >= 2;
  const val = parseFloat(document.getElementById('cant-'+idx).value) || 0;
  const stockDisp = it.stock;
  const quedaria = stockDisp - val;
  const unidadCorta = esCaja ? 'cj' : 'u';
  const el = document.getElementById('queda-'+idx);
  if(el){
    el.textContent = '→ quedarían ' + quedaria + ' ' + unidadCorta;
    el.className = quedaria < 0 ? 'text-red-400' : (quedaria === 0 ? 'text-amber-400' : 'text-gray-400');
  }
}


async function setearCant(idx){
  const it = pedidoActual.items[idx];
  if(!it) return;
  const input = document.getElementById('cant-'+idx);
  const esRepo = pedidoActual.tipo === 'reposicion';
  const esCaja = esRepo && it.es_caja && it.unidades_por_caja >= 2;
  const upc = it.unidades_por_caja || 12;
  let valorMostrado = parseInt(input.value);
  if(isNaN(valorMostrado) || valorMostrado < 0) valorMostrado = 0;
  // Convertir cajas → unidades para guardar (el sistema siempre maneja unidades por debajo)
  let valor = esCaja ? (valorMostrado * upc) : valorMostrado;
  if(valor > it.cantidad) valor = it.cantidad;
  const prep = it.preparado || 0;
  if(valor === prep){ return; } // sin cambios
  const diff = valor - prep;
  if(!esRepo && diff > 0 && diff > it.stock){
    if(!confirm('Estás cargando ' + diff + ' pero hay ' + it.stock + ' en stock. ¿Continuar igual? (el stock puede quedar en 0)')){
      input.value = esCaja ? (prep/upc) : prep; return;
    }
  }
  const stockAnterior = it.stock;
  it.preparado = valor;
  it.completo = valor >= it.cantidad;
  if(!esRepo) it.stock = Math.max(0, it.stock - diff);
  renderArmado();
  try{
    const body = { id_producto: it.id_producto, id_producto_fabrica: it.id_producto_fabrica || null, cantidad: valor, preparado_por: armadoPor };
    if(esRepo) body.sabor = it.sabor || '';
    const r = await fetch(`${API_URL}/armado/pedidos/${pedidoActual.id}/setear_cantidad`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    }).then(x=>x.json());
    if(r && typeof r.cantidad === 'number'){ it.preparado = r.cantidad; it.completo = r.cantidad >= it.cantidad; renderArmado(); }
  }catch(e){
    it.preparado = prep; it.completo = prep >= it.cantidad; it.stock = stockAnterior; renderArmado();
    alert('No se pudo guardar. ¿Corriste el SQL?');
  }
}

function actualizarProgreso(){
  const d = pedidoActual;
  const total = d.items.length;
  const completos = d.items.filter(i=>i.completo).length;
  const pct = total ? Math.round(completos/total*100) : 0;
  $('arm-progreso').style.width = pct + '%';
  $('arm-progreso-txt').textContent = completos + ' de ' + total + ' productos completos';
  $('btn-listo').disabled = completos < total;
  const algoArmado = d.items.some(i=>(i.preparado||0) > 0);
  const aviso = $('aviso-faltan');
  const btnParcial = $('btn-parcial');
  if(completos < total && algoArmado){
    aviso.classList.remove('hidden');
    aviso.textContent = '⚠️ Hay productos incompletos';
    btnParcial.classList.remove('hidden');
  } else {
    aviso.classList.add('hidden');
    btnParcial.classList.add('hidden');
  }
}

function procesarFotoGuia(input){
  var file = input.files[0];
  if(!file) return;
  // Comprimir/redimensionar antes de base64 (máx 1200px, calidad 0.75)
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var MAX = 1200;
      var w = img.width, h = img.height;
      if(w > MAX || h > MAX){
        if(w > h){ h = Math.round(h * MAX/w); w = MAX; }
        else { w = Math.round(w * MAX/h); h = MAX; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      fotoGuiaBase64 = canvas.toDataURL('image/jpeg', 0.75);
      $('desp-foto-img').src = fotoGuiaBase64;
      $('desp-foto-preview').classList.remove('hidden');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function _generarComprobanteArmadoBase64() {
  try {
    var d = pedidoActual;
    if (!d || !d.items || !d.items.length) return null;
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF();
    var num = String(d.id).padStart(4,'0');
    // Membrete simple
    doc.setTextColor(0,0,0); doc.setFontSize(16); doc.setFont('helvetica','bold');
    doc.text('Portal del Viento', 14, 15);
    doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(80,80,80);
    doc.text('Alfajores Portal del Viento SAS  ·  Godoy Cruz, Mendoza', 14, 21);
    doc.setDrawColor(0,0,0); doc.setLineWidth(0.5);
    doc.line(14, 25, 196, 25);
    doc.setTextColor(40,40,40); doc.setFontSize(14); doc.setFont('helvetica','bold');
    doc.text('COMPROBANTE INTERNO  N° ' + num, 105, 34, {align:'center'});
    doc.setFontSize(7.5); doc.setFont('helvetica','bold'); doc.setTextColor(150,60,60);
    doc.text('DOCUMENTO SIN VALOR FISCAL - NO VALIDO COMO FACTURA', 105, 40, {align:'center'});
    doc.setTextColor(0,0,0); doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.text('CLIENTE: ' + (d.distribuidor || ''), 14, 48);
    doc.text('Fecha: ' + new Date().toLocaleDateString('es-AR'), 140, 48);
    doc.setFont('helvetica','bold');
    doc.text('Pedido #' + num + ' — ' + (d.estado || ''), 140, 54);
    doc.setFont('helvetica','normal');
    // Items — usar "preparado" como cantidad despachada
    var hayPrep = d.items.some(function(i){ return (i.preparado||0) > 0; });
    var itemsDesp = hayPrep
      ? d.items.filter(function(i){ return (i.preparado||0) > 0; })
      : d.items;
    if (!itemsDesp.length) return null;
    var brutoTotal = 0, descTotal = 0;
    var filas = itemsDesp.map(function(i){
      var cant = hayPrep ? (i.preparado||0) : (i.cantidad||0);
      var precio = i.precio_unitario||0;
      var descPct = i.descuento_porcentaje||0;
      var bruto = cant * precio;
      var montoDesc = bruto * descPct / 100;
      brutoTotal += bruto; descTotal += montoDesc;
      var pedOrig = i.cantidad||0;
      var nombre = i.nombre||'';
      if (hayPrep && cant < pedOrig) nombre += '  (ped: '+pedOrig+')';
      return [nombre, String(cant),
              precio > 0 ? '$ '+precio.toLocaleString('es-AR') : '-',
              precio > 0 ? '$ '+bruto.toLocaleString('es-AR') : '-',
              descPct > 0 ? descPct+'%' : '-',
              precio > 0 ? '$ '+(bruto-montoDesc).toLocaleString('es-AR',{maximumFractionDigits:2}) : '-'];
    });
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(70,70,70);
    doc.text(hayPrep ? 'Mercadería despachada (cantidades preparadas)' : 'Detalle del pedido', 14, 60);
    doc.setTextColor(0,0,0);
    doc.autoTable({
      startY: 63, margin:{left:14,right:14},
      head:[['Producto','Cant.','P. Lista','Bruto','Desc.','Subtotal']],
      body: filas,
      headStyles:{fillColor:[235,235,235],textColor:[0,0,0],fontStyle:'bold',fontSize:7.5,lineWidth:0.3,lineColor:[0,0,0]},
      styles:{fontSize:7.5,cellPadding:1.5,lineWidth:0.2,lineColor:[120,120,120]},
      columnStyles:{0:{cellWidth:'auto'},1:{halign:'center',cellWidth:14},2:{halign:'right',cellWidth:22},3:{halign:'right',cellWidth:24},4:{halign:'center',cellWidth:14},5:{halign:'right',cellWidth:28}}
    });
    var y = doc.lastAutoTable.finalY + 8;
    var netoFinal = brutoTotal - descTotal;
    doc.setFontSize(10); doc.setFont('helvetica','bold');
    if (descTotal > 0) {
      doc.setTextColor(180,60,60); doc.text('Descuentos:', 130, y, {align:'right'}); doc.text('-$ '+descTotal.toLocaleString('es-AR',{minimumFractionDigits:2}), 196, y, {align:'right'}); y+=6;
    }
    doc.setLineWidth(0.4); doc.setDrawColor(0,0,0); doc.line(100, y-3, 196, y-3);
    doc.setFontSize(12); doc.setTextColor(200,90,0);
    doc.text('TOTAL:', 130, y, {align:'right'});
    doc.text('$ '+netoFinal.toLocaleString('es-AR',{minimumFractionDigits:2}), 196, y, {align:'right'});
    doc.setTextColor(130,130,130); doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
    doc.text('Comprobante interno. No reemplaza factura ni remito fiscal. Emitido el ' +
             new Date().toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}), 14, 285);
    return doc.output('datauristring').split(',')[1];
  } catch(e) {
    console.error('Error generando comprobante:', e);
    return null;
  }
}

async function confirmarDespacho(){
  var transporte = $('desp-transporte').value.trim();
  if(!transporte){ alert('Ingresá el nombre del transporte.'); return; }
  var numero = $('desp-numero').value.trim();
  var enviarWsp = $('desp-enviar-wsp').checked;
  var tel = $('desp-tel').value.trim();
  if(enviarWsp && !tel){ alert('Ingresá el teléfono del cliente para enviar el WhatsApp.'); return; }
  var adjuntarComp = $('desp-adjuntar-comprobante') && $('desp-adjuntar-comprobante').checked;

  var btn = $('btn-confirmar-despacho');
  btn.disabled = true;
  btn.textContent = 'Despachando...';
  $('desp-estado').textContent = '';

  try{
    var body = {
      transporte,
      numero,
      enviar_wsp: enviarWsp,
      telefono_cliente: tel || null
    };
    if(fotoGuiaBase64) body.foto_base64 = fotoGuiaBase64;
    if(adjuntarComp && enviarWsp){
      btn.textContent = 'Generando comprobante...';
      var pdfB64 = _generarComprobanteArmadoBase64();
      if(pdfB64){
        body.comprobante_base64 = pdfB64;
        body.comprobante_nombre = 'Comprobante_' + String(pedidoActual.id).padStart(4,'0') + '.pdf';
      }
      btn.textContent = 'Despachando...';
    }

    var res = await fetch(`${API_URL}/armado/pedidos/${pedidoActual.id}/despachar`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    var data = await res.json();
    if(!res.ok){ throw new Error(data.detail || res.status); }

    var msg = '✅ Pedido despachado!';
    if(data.id_backorder) msg += '\n📦 Backorder generado: #' + data.id_backorder;
    if(enviarWsp) msg += '\n📱 WhatsApp enviado' + (adjuntarComp ? ' con comprobante.' : '.');
    cerrarModalDespachar();
    alert(msg);
    volverLista();
    cargarPedidos();
  } catch(e){
    $('desp-estado').textContent = '❌ ' + (e.message || 'Error al despachar');
    btn.disabled = false;
    btn.textContent = '✅ CONFIRMAR DESPACHO';
  }
}

function cambiarTab(tab){
  var tabs = ['pendientes','historial','stock'];
  tabs.forEach(function(t){
    document.getElementById('cont-'+t).classList.toggle('hidden', t !== tab);
    var btn = document.getElementById('tab-'+t);
    btn.className = 'px-4 py-2 rounded-lg text-sm font-bold ' + (t===tab ? 'bg-neon text-black' : 'border border-gray-700 text-gray-300');
  });
  if(tab === 'historial') cargarHistorial();
  if(tab === 'stock') cargarProductosStock();
}

// CARGA DE STOCK
// ══════════════════════════════════
var todosProductosStock = [];
var productoStockActual = null;

async function cargarProductosStock(){
  var lista = document.getElementById('stock-lista');
  lista.innerHTML = '<p class="text-gray-500 text-sm text-center py-6">Cargando productos...</p>';
  try {
    var prods = await fetch(`${API_URL}/productos`).then(r=>r.json());
    todosProductosStock = prods;
    renderProductosStock(prods);
  } catch(e) {
    lista.innerHTML = '<p class="text-red-400 text-sm text-center py-6">No se pudieron cargar los productos.</p>';
  }
}

function filtrarProductosStock(){
  var q = document.getElementById('stock-buscar').value.toLowerCase();
  var filtrados = todosProductosStock.filter(function(p){
    return !q || (p.nombre||'').toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q);
  });
  renderProductosStock(filtrados);
}

function renderProductosStock(prods){
  var lista = document.getElementById('stock-lista');
  if(!prods.length){ lista.innerHTML = '<p class="text-gray-500 text-sm text-center py-6">Sin resultados.</p>'; return; }
  lista.innerHTML = prods.map(function(p){
    var stock = parseFloat(p.stock_actual||p.stock||0);
    var alerta = p.stock_alerta && stock < p.stock_alerta;
    var stockTxt = '<span class="' + (alerta?'text-red-400 font-bold':'text-gray-400') + '">Stock: ' + stock + (alerta?' ⚠️':'') + '</span>';
    return '<button onclick="abrirIngreso('+JSON.stringify(JSON.stringify(p))+')" class="w-full text-left bg-gray-800 border border-gray-700 hover:border-neon rounded-lg px-3 py-2.5 transition">' +
      '<div class="flex justify-between items-center">' +
      '<span class="text-white text-sm font-bold">' + (p.nombre||'') + '</span>' +
      stockTxt +
      '</div>' +
      (p.sku ? '<span class="text-gray-600 text-xs">' + p.sku + '</span>' : '') +
      '</button>';
  }).join('');
}

function abrirIngreso(prodJson){
  var p = JSON.parse(prodJson);
  productoStockActual = p;
  document.getElementById('stock-prod-nombre').textContent = p.nombre||'';
  document.getElementById('stock-prod-stock').textContent = 'Stock actual: ' + parseFloat(p.stock_actual||p.stock||0) + ' unidades';
  document.getElementById('stock-cantidad').value = '1';
  document.getElementById('stock-motivo').value = '';
  document.getElementById('stock-estado').textContent = '';
  document.getElementById('btn-ingresar-stock').disabled = false;
  document.getElementById('btn-ingresar-stock').textContent = '✅ CONFIRMAR INGRESO';
  document.getElementById('stock-ingreso-panel').classList.remove('hidden');
  document.getElementById('stock-ingreso-panel').scrollIntoView({behavior:'smooth', block:'start'});
}

function cerrarIngreso(){
  productoStockActual = null;
  document.getElementById('stock-ingreso-panel').classList.add('hidden');
}

async function ingresarStock(){
  if(!productoStockActual) return;
  var cant = parseFloat(document.getElementById('stock-cantidad').value);
  if(!cant || cant <= 0){ alert('Ingresá una cantidad válida.'); return; }
  var motivo = document.getElementById('stock-motivo').value.trim();
  var btn = document.getElementById('btn-ingresar-stock');
  var estado = document.getElementById('stock-estado');
  btn.disabled = true;
  btn.textContent = 'Ingresando...';
  estado.textContent = '';
  try {
    var res = await fetch(`${API_URL}/productos/${productoStockActual.id}/ingresar_stock`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({cantidad: cant, motivo: motivo || null})
    });
    var data = await res.json();
    if(!res.ok) throw new Error(data.detail || res.status);
    estado.textContent = '✅ Ingresado! Nuevo stock: ' + data.stock_actual;
    estado.className = 'text-green-400 text-sm mt-2';
    // Actualizar en el array local
    var idx = todosProductosStock.findIndex(function(p){ return p.id === productoStockActual.id; });
    if(idx >= 0) todosProductosStock[idx].stock_actual = data.stock_actual;
    productoStockActual.stock_actual = data.stock_actual;
    document.getElementById('stock-prod-stock').textContent = 'Stock actual: ' + data.stock_actual + ' unidades';
    btn.textContent = '✅ CONFIRMAR INGRESO';
    btn.disabled = false;
    // Refrescar lista (con filtro actual)
    filtrarProductosStock();
  } catch(e) {
    estado.textContent = '❌ ' + (e.message || 'Error');
    estado.className = 'text-red-400 text-sm mt-2';
    btn.disabled = false;
    btn.textContent = '✅ CONFIRMAR INGRESO';
  }
}

async function cargarHistorial(){
  const cont = document.getElementById('lista-historial');
  cont.innerHTML = '<p class="text-gray-500 text-center py-10">Cargando...</p>';
  try{
    const hist = await fetch(`${API_URL}/armado/historial`).then(r=>r.json());
    if(!hist.length){ cont.innerHTML = '<div class="text-center py-12 text-gray-500"><div class="text-4xl mb-2">\ud83d\udce4</div>Todav\u00eda no hay pedidos armados.</div>'; return; }
    cont.innerHTML = hist.map(function(p){
      const esRepo = p.tipo === 'reposicion';
      const titulo = esRepo ? ('Reposici\u00f3n #' + String(p.id).replace('r','')) : ('Pedido #' + p.id);
      const badge = esRepo
        ? '<span class="text-xs font-bold px-2 py-1 rounded-full bg-blue-600/20 text-blue-300">\ud83c\udfea Local</span>'
        : '<span class="text-xs font-bold px-2 py-1 rounded-full bg-gray-700 text-gray-300">\ud83d\ude9a Distribuidor</span>';
      const fecha = (p.fecha||'').replace('T',' ').substring(0,16);
      const montoTxt = (p.total!==null && p.total!==undefined) ? ('<p class="text-gray-400 text-sm">'+fmt(p.total)+'</p>') : '';
      const quien = p.armado_por ? ('<p class="text-neon text-xs mt-0.5">\ud83d\udc64 Armó: '+p.armado_por+'</p>') : '';
      return '<button onclick="abrirPedido(\''+p.id+'\')" class="w-full text-left bg-gray-900 border border-gray-800 rounded-xl p-4 hover:border-gray-600 transition">'+
        '<div class="flex justify-between items-center"><div>'+
        '<p class="text-white font-bold">'+titulo+'</p>'+
        '<p class="text-gray-400 text-sm">'+p.nombre+'</p>'+
        quien+
        '<p class="text-gray-600 text-xs mt-1">'+fecha+' \u00b7 '+p.estado+'</p>'+
        '</div><div class="text-right">'+montoTxt+badge+'</div></div></button>';
    }).join('');
  }catch(e){ cont.innerHTML = '<p class="text-red-400 text-center py-10">No se pudo cargar el historial.</p>'; }
}
