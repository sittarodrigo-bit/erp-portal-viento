<!DOCTYPE html>
<html lang="es">
<head>
    <script>window.PANEL_ACTUAL = 'proveedores';</script>
    <script src="/static/auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Proveedores | Portal del Viento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-neon { color: #e4fc74; }
        .bg-neon { background-color: #e4fc74; }
        .border-neon { border-color: #e4fc74; }
        .modal-oculto { display: none; }
        .modal-visible { display: flex; }

        @media print {
            body { background: #fff !important; color: #000 !important; font-family: Arial, sans-serif; }
            #vista-lista, header, #vista-detalle > div:first-child, .modal-oculto, .modal-visible { display: none !important; }
            #print-area { display: block !important; }
            #print-area table { width: 100%; border-collapse: collapse; font-size: 11px; }
            #print-area th, #print-area td { border: 1px solid #ccc; padding: 5px 8px; }
            #print-area th { background: #f0f0f0 !important; color: #000 !important; font-weight: bold; }
            #print-area .print-header { margin-bottom: 16px; }
            #print-area .print-header h2 { font-size: 16px; font-weight: bold; margin: 0 0 4px; }
            #print-area .print-header p { font-size: 11px; color: #555; margin: 0; }
            #print-area .text-red { color: #c00 !important; font-weight: bold; }
            #print-area .text-green { color: #060 !important; font-weight: bold; }
            #print-area .text-gray { color: #888; }
            #print-area .saldo-final { margin-top: 12px; text-align: right; font-size: 13px; font-weight: bold; }
            @page { margin: 1.5cm; }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 font-sans min-h-screen flex flex-col">

<!-- HEADER -->
<header class="bg-black border-b border-gray-800 px-6 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-4">
        <a href="/admin" class="text-gray-500 hover:text-white text-sm">← Panel</a>
        <div class="h-5 w-px bg-gray-800"></div>
        <h1 class="text-neon font-bold text-lg tracking-widest uppercase">Cuenta Proveedores</h1>
    </div>
    <button onclick="abrirModalNuevoProv()" class="bg-neon text-black font-bold py-1.5 px-5 rounded-lg hover:bg-yellow-300 transition text-sm">+ Proveedor</button>
</header>

<!-- VISTA LISTA -->
<div id="vista-lista" class="flex-1 overflow-y-auto p-6">
    <div class="overflow-x-auto rounded-xl border border-gray-800">
        <table class="w-full text-sm">
            <thead class="bg-gray-900 text-xs text-gray-500 uppercase">
                <tr>
                    <th class="p-4 text-left">Proveedor</th>
                    <th class="p-4 text-left">Categoría</th>
                    <th class="p-4 text-left">Contacto</th>
                    <th class="p-4 text-right">Saldo deuda</th>
                </tr>
            </thead>
            <tbody id="tabla-proveedores" class="divide-y divide-gray-800">
                <tr><td colspan="4" class="p-6 text-center text-gray-600">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- VISTA DETALLE -->
<div id="vista-detalle" class="hidden flex-1 overflow-y-auto flex flex-col">
    <!-- Sub-header detalle -->
    <div class="bg-black border-b border-gray-800 px-6 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-4">
            <button onclick="volverLista()" class="text-gray-500 hover:text-white text-sm">← Volver</button>
            <div class="h-5 w-px bg-gray-800"></div>
            <div>
                <span id="det-nombre" class="font-bold text-white text-base"></span>

            </div>
        </div>
        <div class="flex items-center gap-3">

                <div class="text-xs text-gray-500 uppercase font-bold">Saldo</div>
                <div id="det-saldo" class="font-black text-lg"></div>
            </div>
            <button onclick="abrirModalMovimiento('factura')" class="bg-gray-800 border border-gray-700 hover:border-gray-500 text-white font-bold px-4 py-1.5 rounded text-sm">📄 Factura</button>
            <button onclick="abrirModalMovimiento('remito')"  class="bg-gray-800 border border-gray-700 hover:border-gray-500 text-white font-bold px-4 py-1.5 rounded text-sm">📦 Remito</button>
            <button onclick="abrirModalMovimiento('pago')"    class="bg-neon text-black font-bold px-4 py-1.5 rounded text-sm hover:bg-yellow-300">💵 Pago</button>
            <button onclick="imprimirCuenta()" class="bg-gray-800 border border-gray-700 hover:border-gray-500 text-white font-bold px-3 py-1.5 rounded text-sm" title="Imprimir / Guardar PDF">🖨️</button>

    </div>

    <!-- Tabla cuenta corriente -->
    <div class="flex-1 overflow-y-auto p-6">
        <div class="overflow-x-auto rounded-xl border border-gray-800">
            <table class="w-full text-sm">
                <thead class="bg-gray-900 text-xs text-gray-500 uppercase sticky top-0">
                    <tr>
                        <th class="p-4 text-left">Fecha</th>
                        <th class="p-4 text-left">Tipo</th>
                        <th class="p-4 text-left">N°</th>
                        <th class="p-4 text-left">Concepto</th>
                        <th class="p-4 text-center">Días</th>
                        <th class="p-4 text-right">Debe</th>
                        <th class="p-4 text-right">Haber</th>
                        <th class="p-4 text-right">Saldo</th>

                </thead>

            </table>

</div>

<!-- EDITAR MOVIMIENTO -->
<div id="modal-editar-mov" class="modal-oculto fixed inset-0 bg-black/80 items-center justify-center z-50">

            <div>

            </div>
            <div>
                <label class="block text-xs text-gray-500 font-bold mb-1">N° Documento</label>
                <input type="text" id="edit-numero" class="w-full bg-black border border-gray-700 text-white rounded p-2 text-sm">
            </div>

            </div>

<!-- ══ MODALES ══ -->

            </div>
            <div>
                <label class="block text-xs text-gray-500 font-bold mb-1">Teléfono</label>

<!-- MOVIMIENTO (factura / remito / pago) -->

        <h3 id="mov-titulo" class="text-lg font-bold text-white mb-4 border-l-4 border-neon pl-2"></h3>
        <input type="hidden" id="mov-tipo">
        <div class="grid grid-cols-2 gap-4">
            <div>

                <input type="date" id="mov-fecha" class="w-full bg-black border border-gray-700 text-white rounded p-2 text-sm">

            <div>

        <!-- ÍTEMS REMITO -->
        <div id="campo-items-remito" class="hidden mt-4">
            <div class="flex items-center justify-between mb-2">

                <button type="button" onclick="agregarItemRemito()" class="text-xs bg-gray-800 hover:bg-gray-700 border border-gray-600 text-neon px-3 py-1 rounded font-bold">+ Agregar ítem</button>

            <div class="rounded-lg border border-gray-700 overflow-hidden">

                            <th class="px-3 py-2 text-center w-16">Cant.</th>
                            <th class="px-3 py-2 text-right w-28">P. Unit. ($)</th>
                            <th class="px-3 py-2 text-right w-24">Subtotal</th>

<script>
const API = '';
var proveedores = [];
var provActual = null;
var historialActual = [];

function isoHoy() {
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function formatPeso(n) {
    return '$'+parseFloat(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function cerrarModales() {
    document.querySelectorAll('.modal-visible').forEach(m=>m.classList.replace('modal-visible','modal-oculto'));
}

// ══ LISTA ══
async function cargarProveedores() {
    const tbody = document.getElementById('tabla-proveedores');
    try {
        proveedores = await fetch(API+'/api/prov2/proveedores').then(r=>r.json());
        if (!proveedores.length) {
            tbody.innerHTML='<tr><td colspan="4" class="p-6 text-center text-gray-600">Sin proveedores. Agregá uno con el botón +.</td></tr>';
            return;
        }
        tbody.innerHTML = proveedores.map(p => {
            const saldo = parseFloat(p.saldo||0);
            const saldoStr = saldo > 0
                ? `<span class="text-red-400 font-bold">${formatPeso(saldo)}</span>`
                : saldo < 0
                    ? `<span class="text-green-400 font-bold">${formatPeso(saldo)}</span>`
                    : `<span class="text-gray-500">$0</span>`;
            return `<tr class="hover:bg-gray-900 cursor-pointer border-b border-gray-800 transition" onclick="abrirDetalle(${p.id})">
                <td class="p-4 font-bold text-white">${p.razon_social}</td>
                <td class="p-4 text-xs text-gray-400"><span class="bg-gray-800 px-2 py-0.5 rounded">${p.categoria||'—'}</span></td>
                <td class="p-4 text-xs text-gray-400">${p.contacto||''} ${p.telefono?'· '+p.telefono:''}</td>
                <td class="p-4 text-right">${saldoStr}</td>
            </tr>`;
        }).join('');
    } catch(e) {
        tbody.innerHTML='<tr><td colspan="4" class="p-6 text-center text-red-400">Error al cargar.</td></tr>';
    }
}

function abrirModalNuevoProv() {
    ['np-razon','np-cuit','np-contacto','np-tel','np-email','np-notas'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('np-cat').value='Materia prima';
    document.getElementById('np-plazo').value='0';
    document.getElementById('np-deuda').value='0';
    document.getElementById('modal-nuevo-prov').classList.replace('modal-oculto','modal-visible');
}
async function guardarNuevoProv() {
    const razon = document.getElementById('np-razon').value.trim();
    if (!razon) { alert('Ingresá la razón social.'); return; }
    const data = {
        razon_social: razon,
        cuit: document.getElementById('np-cuit').value.trim()||null,
        categoria: document.getElementById('np-cat').value,
        contacto: document.getElementById('np-contacto').value.trim()||null,
        telefono: document.getElementById('np-tel').value.trim()||null,
        email: document.getElementById('np-email').value.trim()||null,
        dias_plazo: parseInt(document.getElementById('np-plazo').value)||0,
        deuda_inicial: parseFloat(document.getElementById('np-deuda').value)||0,
        notas: document.getElementById('np-notas').value.trim()||null
    };
    const r = await fetch(API+'/api/prov2/proveedores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if (r.ok) { cerrarModales(); cargarProveedores(); }
    else { const e=await r.json(); alert('Error: '+e.detail); }
}

// ══ DETALLE ══
async function abrirDetalle(id) {
    provActual = proveedores.find(p=>p.id===id);
    document.getElementById('vista-lista').classList.add('hidden');
    const det = document.getElementById('vista-detalle');
    det.classList.remove('hidden');
    det.classList.add('flex');
    document.getElementById('tabla-movimientos').innerHTML='<tr><td colspan="8" class="p-6 text-center text-gray-600">Cargando...</td></tr>';
    await cargarDetalle(id);
}
function volverLista() {
    document.getElementById('vista-detalle').classList.add('hidden');
    document.getElementById('vista-detalle').classList.remove('flex');
    document.getElementById('vista-lista').classList.remove('hidden');
    cargarProveedores();
}
async function cargarDetalle(id) {
    try {
        const data = await fetch(API+'/api/prov2/proveedores/'+id+'/cuenta').then(r=>r.json());
        const p = data.proveedor;
        provActual = p;
        historialActual = data.historial;
        document.getElementById('det-nombre').textContent = p.razon_social;
        document.getElementById('det-cuit').textContent = p.cuit ? 'CUIT: '+p.cuit : '';
        const saldo = parseFloat(data.saldo||0);
        const saldoEl = document.getElementById('det-saldo');
        saldoEl.textContent = formatPeso(saldo);
        saldoEl.className = 'font-black text-lg ' + (saldo > 0 ? 'text-red-400' : saldo < 0 ? 'text-green-400' : 'text-gray-400');

        const tbody = document.getElementById('tabla-movimientos');
        if (!historialActual.length) {
            tbody.innerHTML='<tr><td colspan="9" class="p-6 text-center text-gray-600">Sin movimientos. Registrá una factura, remito o pago.</td></tr>';
            return;
        }
        const TIPO = {
            saldo_inicial: { label:'Saldo inicial', color:'text-orange-400', icon:'⚡' },
            factura:       { label:'Factura',       color:'text-red-400',    icon:'📄' },
            remito:        { label:'Remito',        color:'text-blue-400',   icon:'📦' },
            pago:          { label:'Pago',          color:'text-green-400',  icon:'💵' },
        };
        var filas = [];
        historialActual.forEach(function(m) {
            const t = TIPO[m.tipo] || { label: m.tipo, color:'text-gray-400', icon:'·' };
            const monto = parseFloat(m.monto||0);
            const esDebe = m.tipo==='factura' || m.tipo==='saldo_inicial' || (m.tipo==='remito' && monto > 0);
            const esHaber = m.tipo==='pago';
            const debe  = esDebe  ? `<span class="text-red-400 font-bold">${formatPeso(monto)}</span>` : '<span class="text-gray-700">—</span>';
            const haber = esHaber ? `<span class="text-green-400 font-bold">${formatPeso(monto)}</span>` : '<span class="text-gray-700">—</span>';
            const saldoFila = parseFloat(m.saldo||0);
            const saldoColor = saldoFila > 0 ? 'text-red-400' : saldoFila < 0 ? 'text-green-400' : 'text-gray-500';
            const accionEditar = (m.id && m.tipo !== 'saldo_inicial') ? `<button onclick="editarMovimiento(${m.id})" class="text-gray-500 hover:text-yellow-300 text-sm px-1" title="Editar">✏️</button>` : '';
            const acciones = m.id ? `<button onclick="eliminarMovimiento(${m.id})" class="text-gray-600 hover:text-red-400 text-sm px-2">✕</button>` : '';
            // Días transcurridos — solo para facturas con fecha
            let diasCell = '<td class="p-4 text-center text-gray-700">—</td>';
            if (m.tipo === 'factura' && m.fecha) {
                const dias = Math.floor((Date.now() - new Date(m.fecha).getTime()) / 86400000);
                const color = dias > 30 ? 'text-red-400 font-bold' : dias > 15 ? 'text-orange-400 font-bold' : 'text-gray-400';
                diasCell = `<td class="p-4 text-center text-sm ${color}">${dias}d</td>`;
            }

            // Concepto: para remitos y facturas con ítems JSON, mostrar resumen
            var items = null;
            if ((m.tipo === 'remito' || m.tipo === 'factura') && m.detalle_remito) {
                try { items = JSON.parse(m.detalle_remito); if (!Array.isArray(items)) items = null; } catch(e) { items = null; }
            }
            var conceptoTexto;
            if (items && items.length) {
                conceptoTexto = items.length + ' ítem' + (items.length>1?'s':'');
            } else {
                conceptoTexto = m.concepto || (!items && m.detalle_remito ? m.detalle_remito : '—');
            }
            // Botón expandir ítems (remitos y facturas con items)
            var btnExpandir = '';
            var rowId = 'row-items-'+m.id;
            if (items && items.length) {
                btnExpandir = `<button onclick="toggleItemsRemitoCta('${rowId}')" class="text-blue-400 hover:text-blue-200 text-xs px-2 font-bold" title="Ver ítems">📋</button>`;
            }

            filas.push(`<tr class="hover:bg-gray-900 border-b border-gray-800">
                <td class="p-4 text-xs text-gray-400">${m.fecha||'—'}</td>
                <td class="p-4"><span class="${t.color} text-xs font-bold">${t.icon} ${t.label}</span></td>
                <td class="p-4 text-xs text-gray-400 font-mono">${m.numero||'—'}</td>
                <td class="p-4 text-xs text-gray-300">${conceptoTexto}</td>
                ${diasCell}
                <td class="p-4 text-right">${debe}</td>
                <td class="p-4 text-right">${haber}</td>
                <td class="p-4 text-right font-bold font-mono text-sm ${saldoColor}">${formatPeso(saldoFila)}</td>
                <td class="p-4 text-center flex items-center justify-center gap-1">${btnExpandir}${accionEditar}${acciones}</td>
            </tr>`);

            // Fila expandible de ítems (oculta por defecto)
            if (items && items.length) {
                var itemsHtml = `<table class="w-full text-xs"><thead class="text-gray-500"><tr><th class="px-3 py-1 text-left">Descripción</th><th class="px-3 py-1 text-center">Cant.</th><th class="px-3 py-1 text-right">P. Unit.</th><th class="px-3 py-1 text-right">Subtotal</th></tr></thead><tbody>`
                    + items.map(function(it){
                        var sub = (parseFloat(it.cant)||0)*(parseFloat(it.precio)||0);
                        return `<tr class="border-t border-gray-800"><td class="px-3 py-1 text-gray-200">${escHtmlCta(it.desc)}</td><td class="px-3 py-1 text-center text-gray-400">${it.cant}</td><td class="px-3 py-1 text-right text-gray-400">${formatPeso(it.precio)}</td><td class="px-3 py-1 text-right text-neon font-bold">${sub>0?formatPeso(sub):'—'}</td></tr>`;
                    }).join('')
                    + `</tbody></table>`;
                filas.push(`<tr id="${rowId}" class="hidden border-b border-gray-800 bg-gray-900/50"><td colspan="9" class="px-6 py-3">${itemsHtml}</td></tr>`);
            }
        });
        tbody.innerHTML = filas.join('');
    } catch(e) {
        document.getElementById('tabla-movimientos').innerHTML='<tr><td colspan="8" class="p-6 text-center text-red-400">Error al cargar.</td></tr>';
    }
}

// ══ MOVIMIENTO ══
const TITULOS = { factura:'📄 Cargar Factura', remito:'📦 Cargar Remito', pago:'💵 Registrar Pago' };
var itemsRemito = [];

function abrirModalMovimiento(tipo) {
    document.getElementById('mov-tipo').value = tipo;
    document.getElementById('mov-titulo').textContent = TITULOS[tipo];
    document.getElementById('mov-fecha').value = isoHoy();
    document.getElementById('mov-numero').value = '';
    document.getElementById('mov-monto').value = '';
    document.getElementById('mov-concepto').value = '';
    document.getElementById('campo-monto-wrap').classList.toggle('hidden', tipo==='remito' || tipo==='factura');
    document.getElementById('campo-metodo-wrap').classList.toggle('hidden', tipo!=='pago');
    document.getElementById('campo-items-remito').classList.toggle('hidden', tipo==='pago');
    var labelItems = document.getElementById('label-items-mov');
    if (labelItems) labelItems.textContent = tipo==='factura' ? 'Ítems de la factura' : 'Ítems del remito';
    // Para remito: "Concepto" es opcional (encabezado general), lo mostramos más pequeño
    var concLabel = document.querySelector('#campo-concepto-wrap label');
    if (concLabel) concLabel.textContent = (tipo==='remito'||tipo==='factura') ? 'Concepto general (opcional)' : 'Concepto / Detalle';
    // Reset ítems remito/factura
    itemsRemito = [];
    if (tipo==='remito' || tipo==='factura') {
        renderItemsRemito();
        agregarItemRemito(); // arranca con 1 fila vacía
    }
    document.getElementById('modal-movimiento').classList.replace('modal-oculto','modal-visible');
    setTimeout(()=>document.getElementById(tipo==='remito'?'mov-numero':'mov-monto').focus(),100);
}

function agregarItemRemito() {
    itemsRemito.push({ desc:'', cant:1, precio:0 });
    renderItemsRemito();
    // focus en la última descripción
    var idx = itemsRemito.length-1;
    var inp = document.getElementById('ri-desc-'+idx);
    if (inp) inp.focus();
}

function renderItemsRemito() {
    var tbody = document.getElementById('items-remito-tbody');
    if (!tbody) return;
    if (!itemsRemito.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-3 py-3 text-center text-gray-600 text-xs">Sin ítems. Agregá uno con el botón +</td></tr>';
        document.getElementById('remito-total-display').textContent = '$0,00';
        return;
    }
    tbody.innerHTML = itemsRemito.map(function(it, idx) {
        var subtotal = (parseFloat(it.cant)||0) * (parseFloat(it.precio)||0);
        var subStr = subtotal > 0 ? formatPeso(subtotal) : '—';
        return '<tr class="border-t border-gray-800">'
            +'<td class="px-2 py-1"><input type="text" id="ri-desc-'+idx+'" value="'+escHtml(it.desc)+'" oninput="updateItemRemito('+idx+',\'desc\',this.value)" placeholder="Ej: Harina 000" class="w-full bg-transparent text-white text-xs rounded px-1 py-0.5 border border-transparent focus:border-gray-600 outline-none"></td>'
            +'<td class="px-2 py-1"><input type="number" id="ri-cant-'+idx+'" value="'+(it.cant||'')+'" min="0" step="0.001" oninput="updateItemRemito('+idx+',\'cant\',this.value)" class="w-16 bg-gray-800 text-white text-xs rounded px-2 py-0.5 text-center border border-gray-700 outline-none focus:border-neon"></td>'
            +'<td class="px-2 py-1"><input type="number" id="ri-prec-'+idx+'" value="'+(it.precio||'')+'" min="0" step="0.01" oninput="updateItemRemito('+idx+',\'precio\',this.value)" class="w-28 bg-gray-800 text-white text-xs rounded px-2 py-0.5 text-right border border-gray-700 outline-none focus:border-neon"></td>'
            +'<td class="px-3 py-1 text-right text-xs font-bold '+(subtotal>0?'text-neon':'text-gray-600')+'" id="ri-sub-'+idx+'">'+subStr+'</td>'
            +'<td class="px-1 py-1 text-center"><button type="button" onclick="quitarItemRemito('+idx+')" class="text-gray-600 hover:text-red-400 text-sm font-bold">✕</button></td>'
            +'</tr>';
    }).join('');
    actualizarTotalRemito();
}

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function updateItemRemito(idx, campo, val) {
    if (!itemsRemito[idx]) return;
    itemsRemito[idx][campo] = val;
    // actualizar subtotal de la fila sin re-render completo
    var cant = parseFloat(itemsRemito[idx].cant)||0;
    var precio = parseFloat(itemsRemito[idx].precio)||0;
    var sub = cant * precio;
    var subEl = document.getElementById('ri-sub-'+idx);
    if (subEl) {
        subEl.textContent = sub > 0 ? formatPeso(sub) : '—';
        subEl.className = 'px-3 py-1 text-right text-xs font-bold '+(sub>0?'text-neon':'text-gray-600');
    }
    actualizarTotalRemito();
}

function quitarItemRemito(idx) {
    itemsRemito.splice(idx, 1);
    renderItemsRemito();
}

function actualizarTotalRemito() {
    var total = itemsRemito.reduce(function(acc, it) {
        return acc + (parseFloat(it.cant)||0) * (parseFloat(it.precio)||0);
    }, 0);
    var el = document.getElementById('remito-total-display');
    if (el) el.textContent = formatPeso(total);
}

function calcTotalRemito() {
    return itemsRemito.reduce(function(acc, it) {
        return acc + (parseFloat(it.cant)||0) * (parseFloat(it.precio)||0);
    }, 0);
}

async function guardarMovimiento() {
    const tipo = document.getElementById('mov-tipo').value;
    var monto, detalleRemito;
    if (tipo === 'remito' || tipo === 'factura') {
        // Validar que haya al menos 1 ítem con descripción
        var itemsValidos = itemsRemito.filter(function(it){ return String(it.desc||'').trim() !== ''; });
        if (!itemsValidos.length) { alert('Agregá al menos un ítem con descripción.'); return; }
        monto = calcTotalRemito();
        if (tipo === 'factura' && (!monto || monto <= 0)) { alert('Los ítems de la factura deben tener precio.'); return; }
        // Guardar ítems como JSON en detalle_remito
        detalleRemito = JSON.stringify(itemsValidos.map(function(it){
            return { desc: String(it.desc||'').trim(), cant: parseFloat(it.cant)||0, precio: parseFloat(it.precio)||0 };
        }));
    } else {
        monto = parseFloat(document.getElementById('mov-monto').value);
        if (!monto||monto<=0) { alert('Ingresá un monto válido.'); return; }
        detalleRemito = null;
    }
    const btn = document.getElementById('btn-guardar-mov');
    btn.disabled=true; btn.textContent='Guardando...';
    try {
        const data = {
            id_proveedor: provActual.id,
            tipo,
            fecha: document.getElementById('mov-fecha').value||null,
            numero: document.getElementById('mov-numero').value.trim()||null,
            monto,
            concepto: document.getElementById('mov-concepto').value.trim()||null,
            metodo: tipo==='pago' ? document.getElementById('mov-metodo').value : null,
            detalle_remito: detalleRemito
        };
        const r = await fetch(API+'/api/prov2/movimientos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
        if (r.ok) { cerrarModales(); cargarDetalle(provActual.id); }
        else { const e=await r.json(); alert('Error: '+e.detail); }
    } catch { alert('Error de conexión.'); }
    finally { btn.disabled=false; btn.textContent='Registrar'; }
}
async function eliminarMovimiento(id) {
    if (!confirm('¿Eliminar este movimiento?')) return;
    const r = await fetch(API+'/api/prov2/movimientos/'+id,{method:'DELETE'});
    if (r.ok) cargarDetalle(provActual.id);
    else alert('No se pudo eliminar.');
}

// ══ EDICIÓN DE MOVIMIENTO ══
var itemsEdicion = [];

function editarMovimiento(id) {
    var m = historialActual.find(function(x){ return x.id === id; });
    if (!m) return;
    var tipo = m.tipo;
    var TITULOS_EDIT = { factura:'✏️ Editar Factura', remito:'✏️ Editar Remito', pago:'✏️ Editar Pago' };
    document.getElementById('edit-id').value = id;
    document.getElementById('edit-tipo').value = tipo;
    document.getElementById('edit-titulo').textContent = TITULOS_EDIT[tipo] || '✏️ Editar';
    document.getElementById('edit-fecha').value = m.fecha || '';
    document.getElementById('edit-numero').value = m.numero || '';
    document.getElementById('edit-monto').value = tipo === 'remito' ? '' : (m.monto || '');
    document.getElementById('edit-concepto').value = m.concepto || '';
    // monto y método
    document.getElementById('edit-monto-wrap').classList.toggle('hidden', tipo === 'remito');
    document.getElementById('edit-metodo-wrap').classList.toggle('hidden', tipo !== 'pago');
    if (tipo === 'pago') document.getElementById('edit-metodo').value = m.metodo || 'transferencia';
    // ítems remito/factura
    var esConItems = tipo === 'remito' || tipo === 'factura';
    document.getElementById('edit-items-wrap').classList.toggle('hidden', !esConItems);
    var concLabel = document.querySelector('#edit-concepto-wrap label');
    if (concLabel) concLabel.textContent = esConItems ? 'Concepto general (opcional)' : 'Concepto / Detalle';
    if (esConItems) {
        itemsEdicion = [];
        if (m.detalle_remito) {
            try {
                var its = JSON.parse(m.detalle_remito);
                if (Array.isArray(its)) itemsEdicion = its.map(function(i){ return { desc: i.desc||'', cant: i.cant||1, precio: i.precio||0 }; });
            } catch(e) {}
        }
        if (!itemsEdicion.length) itemsEdicion.push({ desc:'', cant:1, precio:0 });
        renderItemsEdicion();
    }
    document.getElementById('modal-editar-mov').classList.replace('modal-oculto','modal-visible');
}

function agregarItemEdicion() {
    itemsEdicion.push({ desc:'', cant:1, precio:0 });
    renderItemsEdicion();
    var idx = itemsEdicion.length - 1;
    var inp = document.getElementById('ei-desc-'+idx);
    if (inp) inp.focus();
}

function renderItemsEdicion() {
    var tbody = document.getElementById('edit-items-tbody');
    if (!tbody) return;
    if (!itemsEdicion.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-3 py-3 text-center text-gray-600 text-xs">Sin ítems.</td></tr>';
        document.getElementById('edit-total-display').textContent = '$0,00';
        return;
    }
    tbody.innerHTML = itemsEdicion.map(function(it, idx) {
        var subtotal = (parseFloat(it.cant)||0) * (parseFloat(it.precio)||0);
        return '<tr class="border-t border-gray-800">'
            +'<td class="px-2 py-1"><input type="text" id="ei-desc-'+idx+'" value="'+escHtml(it.desc)+'" oninput="updateItemEdicion('+idx+',\'desc\',this.value)" class="w-full bg-transparent text-white text-xs rounded px-1 py-0.5 border border-transparent focus:border-gray-600 outline-none"></td>'
            +'<td class="px-2 py-1"><input type="number" id="ei-cant-'+idx+'" value="'+(it.cant||'')+'" min="0" step="0.001" oninput="updateItemEdicion('+idx+',\'cant\',this.value)" class="w-16 bg-gray-800 text-white text-xs rounded px-2 py-0.5 text-center border border-gray-700 outline-none focus:border-neon"></td>'
            +'<td class="px-2 py-1"><input type="number" id="ei-prec-'+idx+'" value="'+(it.precio||'')+'" min="0" step="0.01" oninput="updateItemEdicion('+idx+',\'precio\',this.value)" class="w-28 bg-gray-800 text-white text-xs rounded px-2 py-0.5 text-right border border-gray-700 outline-none focus:border-neon"></td>'
            +'<td class="px-3 py-1 text-right text-xs font-bold '+(subtotal>0?'text-neon':'text-gray-600')+'" id="ei-sub-'+idx+'">'+(subtotal>0?formatPeso(subtotal):'—')+'</td>'
            +'<td class="px-1 py-1 text-center"><button type="button" onclick="quitarItemEdicion('+idx+')" class="text-gray-600 hover:text-red-400 text-sm font-bold">✕</button></td>'
            +'</tr>';
    }).join('');
    actualizarTotalEdicion();
}

function updateItemEdicion(idx, campo, val) {
    if (!itemsEdicion[idx]) return;
    itemsEdicion[idx][campo] = val;
    var cant = parseFloat(itemsEdicion[idx].cant)||0;
    var precio = parseFloat(itemsEdicion[idx].precio)||0;
    var sub = cant * precio;
    var subEl = document.getElementById('ei-sub-'+idx);
    if (subEl) {
        subEl.textContent = sub > 0 ? formatPeso(sub) : '—';
        subEl.className = 'px-3 py-1 text-right text-xs font-bold '+(sub>0?'text-neon':'text-gray-600');
    }
    actualizarTotalEdicion();
}

function quitarItemEdicion(idx) {
    itemsEdicion.splice(idx, 1);
    renderItemsEdicion();
}

function actualizarTotalEdicion() {
    var total = itemsEdicion.reduce(function(acc, it) {
        return acc + (parseFloat(it.cant)||0) * (parseFloat(it.precio)||0);
    }, 0);
    var el = document.getElementById('edit-total-display');
    if (el) el.textContent = formatPeso(total);
}

async function guardarEdicionMovimiento() {
    var id = parseInt(document.getElementById('edit-id').value);
    var tipo = document.getElementById('edit-tipo').value;
    var monto, detalleRemito;
    if (tipo === 'remito') {
        var validos = itemsEdicion.filter(function(it){ return String(it.desc||'').trim() !== ''; });
        if (!validos.length) { alert('Agregá al menos un ítem con descripción.'); return; }
        monto = validos.reduce(function(acc,it){ return acc+(parseFloat(it.cant)||0)*(parseFloat(it.precio)||0); }, 0);
        detalleRemito = JSON.stringify(validos.map(function(it){
            return { desc: String(it.desc||'').trim(), cant: parseFloat(it.cant)||0, precio: parseFloat(it.precio)||0 };
        }));
    } else {
        monto = parseFloat(document.getElementById('edit-monto').value);
        if (!monto || monto <= 0) { alert('Ingresá un monto válido.'); return; }
        detalleRemito = null;
    }
    var btn = document.getElementById('btn-guardar-edit');
    btn.disabled = true; btn.textContent = 'Guardando...';
    try {
        var data = {
            id_proveedor: provActual.id,
            tipo: tipo,
            fecha: document.getElementById('edit-fecha').value || null,
            numero: document.getElementById('edit-numero').value.trim() || null,
            monto: monto,
            concepto: document.getElementById('edit-concepto').value.trim() || null,
            metodo: tipo === 'pago' ? document.getElementById('edit-metodo').value : null,
            detalle_remito: detalleRemito
        };
        var r = await fetch(API+'/api/prov2/movimientos/'+id, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
        if (r.ok) { cerrarModales(); cargarDetalle(provActual.id); }
        else { var e = await r.json(); alert('Error: '+e.detail); }
    } catch(e) { alert('Error de conexión.'); }
    finally { btn.disabled = false; btn.textContent = 'Guardar cambios'; }
}

function imprimirCuenta() {
    if (!provActual || !historialActual) return;
    var saldoFinal = parseFloat(document.getElementById('det-saldo').textContent.replace(/[^0-9,.\-]/g,'').replace(',','.')) || 0;
    var saldoTexto = document.getElementById('det-saldo').textContent;

    const TIPO = {
        saldo_inicial: 'Saldo inicial',
        factura: 'Factura',
        remito: 'Remito',
        pago: 'Pago'
    };

    var filas = historialActual.map(function(m) {
        var monto = parseFloat(m.monto||0);
        var esDebe = m.tipo==='factura' || m.tipo==='saldo_inicial' || (m.tipo==='remito' && monto > 0);
        var esHaber = m.tipo==='pago';
        var debe  = esDebe  ? formatPeso(monto) : '—';
        var haber = esHaber ? formatPeso(monto) : '—';
        var saldoFila = parseFloat(m.saldo||0);
        var saldoClass = saldoFila > 0 ? 'text-red' : saldoFila < 0 ? 'text-green' : 'text-gray';
        var tipoLabel = TIPO[m.tipo] || m.tipo;

        // concepto/detalle
        var concepto = m.concepto || '';
        if ((m.tipo==='remito' || m.tipo==='factura') && m.detalle_remito) {
            try {
                var its = JSON.parse(m.detalle_remito);
                if (Array.isArray(its) && its.length) concepto = its.map(function(i){ return i.cant+'x '+i.desc; }).join(', ');
            } catch(e) { concepto = m.detalle_remito; }
        }

        return '<tr>'
            +'<td>'+(m.fecha||'—')+'</td>'
            +'<td>'+tipoLabel+'</td>'
            +'<td>'+(m.numero||'—')+'</td>'
            +'<td>'+escHtmlCta(concepto||'—')+'</td>'
            +'<td style="text-align:right" class="text-red">'+debe+'</td>'
            +'<td style="text-align:right" class="text-green">'+haber+'</td>'
            +'<td style="text-align:right; font-weight:bold" class="'+saldoClass+'">'+formatPeso(saldoFila)+'</td>'
            +'</tr>';
    }).join('');

    var now = new Date();
    var fechaImp = now.toLocaleDateString('es-AR') + ' ' + now.toLocaleTimeString('es-AR', {hour:'2-digit',minute:'2-digit'});
    var cuit = provActual.cuit ? ' · CUIT: '+provActual.cuit : '';
    var saldoColorImp = parseFloat(document.getElementById('det-saldo').textContent.replace(/\$/,'')) >= 0 ? 'color:#c00' : 'color:#060';

    document.getElementById('print-area').innerHTML =
        '<div class="print-header">'
        +'<h2>Cuenta Corriente — '+escHtmlCta(provActual.razon_social)+'</h2>'
        +'<p>'+cuit+' · Impreso el '+fechaImp+'</p>'
        +'</div>'
        +'<table>'
        +'<thead><tr><th>Fecha</th><th>Tipo</th><th>N°</th><th>Concepto</th><th style="text-align:right">Debe</th><th style="text-align:right">Haber</th><th style="text-align:right">Saldo</th></tr></thead>'
        +'<tbody>'+filas+'</tbody>'
        +'</table>'
        +'<div class="saldo-final">Saldo total: <span style="'+saldoColorImp+'">'+saldoTexto+'</span></div>';

    window.print();
}

    var row = document.getElementById(rowId);
    if (row) row.classList.toggle('hidden');
}
