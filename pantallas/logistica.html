<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Logística – Portal del Viento</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0a0a0a; color:#fff; font-family:system-ui,sans-serif; -webkit-tap-highlight-color:transparent; }
  .neon { color:#e4fc74; }
  .pulse { animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
  input,textarea,select { background:#111; border:1px solid #333; color:#fff; border-radius:0.75rem; padding:0.75rem 1rem; width:100%; font-size:1rem; }
  input:focus,textarea:focus,select:focus { outline:none; border-color:#e4fc74; }
  .btn { display:block; width:100%; padding:1.2rem; border-radius:1rem; font-size:1.1rem; font-weight:800; text-align:center; border:none; cursor:pointer; transition:opacity .15s,transform .1s; }
  .btn:active { transform:scale(.97); opacity:.85; }
  .btn-rojo  { background:#ef4444; color:#fff; }
  .btn-neon  { background:#e4fc74; color:#000; }
  /* Teclado PIN */
  .pin-dot { width:14px; height:14px; border-radius:50%; background:#333; transition:background .15s; }
  .pin-dot.lleno { background:#e4fc74; }
  .tecla { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:1rem; font-size:1.5rem; font-weight:700; padding:1.1rem; cursor:pointer; transition:background .1s,transform .1s; user-select:none; }
  .tecla:active { background:#2a2a2a; transform:scale(.93); }
  /* Campo KM — solo visible para combustible */
  #row-km { display:none; }
  #row-km.visible { display:block; }
</style>
</head>
<body class="min-h-screen p-5 pb-10">

<div class="max-w-sm mx-auto">
  <div class="text-center mb-6">
    <p class="text-gray-600 text-xs uppercase tracking-widest mb-1">Portal del Viento</p>
    <h1 class="text-2xl font-black text-white">Logística</h1>
  </div>

  <!-- ── PANEL LOGIN PIN ── -->
  <div id="panel-inicio">
    <p class="text-gray-500 text-sm text-center mb-6">Ingresá tu PIN de 4 dígitos para iniciar el turno.</p>

    <!-- Indicador PIN -->
    <div class="flex justify-center gap-4 mb-6">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>

    <!-- Teclado numérico -->
    <div class="grid grid-cols-3 gap-3 mb-4">
      <button class="tecla" onclick="teclaPin('1')">1</button>
      <button class="tecla" onclick="teclaPin('2')">2</button>
      <button class="tecla" onclick="teclaPin('3')">3</button>
      <button class="tecla" onclick="teclaPin('4')">4</button>
      <button class="tecla" onclick="teclaPin('5')">5</button>
      <button class="tecla" onclick="teclaPin('6')">6</button>
      <button class="tecla" onclick="teclaPin('7')">7</button>
      <button class="tecla" onclick="teclaPin('8')">8</button>
      <button class="tecla" onclick="teclaPin('9')">9</button>
      <button class="tecla text-gray-500" onclick="borrarPin()">⌫</button>
      <button class="tecla" onclick="teclaPin('0')">0</button>
      <button class="tecla bg-green-900 text-green-400 border-green-800" onclick="confirmarPin()">✓</button>
    </div>

    <div id="err-inicio" class="text-red-400 text-sm text-center mt-3 hidden"></div>
  </div>

  <!-- ── PANEL ACTIVO ── -->
  <div id="panel-activo" class="hidden">

    <!-- Estado -->
    <div class="bg-green-950 border border-green-800 rounded-2xl p-4 mb-5 flex items-center gap-3">
      <span class="w-3 h-3 bg-green-400 rounded-full pulse flex-shrink-0"></span>
      <div class="flex-1">
        <p class="text-green-400 font-black text-xs uppercase tracking-widest">En logística</p>
        <p id="txt-nombre" class="text-white font-bold text-lg leading-tight"></p>
        <p id="txt-inicio" class="text-gray-500 text-xs"></p>
      </div>
      <div class="text-right">
        <p class="text-gray-600 text-xs uppercase font-bold mb-0.5">Tiempo</p>
        <p id="txt-timer" class="neon font-black text-lg tabular-nums">00:00:00</p>
      </div>
    </div>

    <!-- Gastos del turno -->
    <div class="mb-5">
      <div class="flex items-center justify-between mb-2">
        <p class="text-gray-500 text-xs uppercase font-bold">💸 Gastos del turno</p>
        <p id="txt-total" class="text-green-400 font-black text-sm">$ 0 a rendir</p>
      </div>
      <div id="lista-gastos" class="space-y-2"></div>
    </div>

    <!-- Formulario nuevo gasto -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 mb-5">
      <p class="text-gray-400 text-sm font-bold mb-3">+ Registrar gasto</p>

      <!-- Tipo de gasto -->
      <div class="mb-3">
        <select id="gasto-tipo" onchange="onTipoGasto()">
          <option value="">Tipo de gasto…</option>
          <option value="Combustible">⛽ Combustible</option>
          <option value="Peaje">🛣️ Peaje</option>
          <option value="Estacionamiento">🅿️ Estacionamiento</option>
          <option value="Nafta">🔧 Nafta / aceite</option>
          <option value="Comida">🍔 Comida</option>
          <option value="Otro">📋 Otro</option>
        </select>
      </div>

      <!-- Descripción libre (se rellena automáticamente pero editable) -->
      <input id="gasto-desc" type="text" placeholder="Descripción" class="mb-3">

      <!-- KM del vehículo — solo para Combustible -->
      <div id="row-km" class="mb-3">
        <label class="text-gray-500 text-xs uppercase font-bold block mb-1">📏 KM del vehículo</label>
        <input id="gasto-km" type="number" placeholder="Ej: 45320" min="0" step="1">
      </div>

      <input id="gasto-monto" type="number" placeholder="Monto $" min="1" step="1" class="mb-3">

      <!-- Foto del comprobante -->
      <label class="flex items-center gap-2 text-gray-400 text-sm mb-3 cursor-pointer">
        <span class="bg-gray-800 border border-gray-700 px-3 py-2 rounded-lg text-xs font-bold">📷 Foto del comprobante</span>
        <span id="txt-foto" class="text-gray-600 text-xs">Sin foto</span>
        <input type="file" id="gasto-foto" accept="image/*" capture="environment" class="hidden" onchange="previewFoto()">
      </label>
      <img id="preview-foto" class="hidden w-full rounded-lg mb-3 max-h-40 object-cover">

      <button class="btn btn-neon" onclick="registrarGasto()">Guardar gasto</button>
      <div id="err-gasto" class="text-red-400 text-sm text-center mt-2 hidden"></div>
    </div>

    <!-- Finalizar -->
    <button class="btn btn-rojo" onclick="finalizar()">🏁 Finalizar turno</button>
  </div>
</div>

<script>
const API = window.location.origin + '/api';
let sesionId = null;
let intervalGPS = null;
let intervalTimer = null;
let inicioTS = null;
let gastos = [];
let pinActual = '';

// ── TECLADO PIN ──
function teclaPin(d) {
  if (pinActual.length >= 4) return;
  pinActual += d;
  actualizarDots();
  if (pinActual.length === 4) setTimeout(confirmarPin, 200);
}
function borrarPin() {
  pinActual = pinActual.slice(0, -1);
  actualizarDots();
}
function actualizarDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('d' + i).classList.toggle('lleno', i < pinActual.length);
  }
}

async function confirmarPin() {
  if (pinActual.length !== 4) return;
  const pin = pinActual;
  pinActual = '';
  actualizarDots();
  try {
    const res = await fetch(API + '/logistica/iniciar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin })
    });
    const data = await res.json();
    if (!res.ok) {
      mostrarError('err-inicio', data.detail || 'PIN incorrecto o sin permiso.');
      return;
    }
    sesionId = data.id;
    const ahora = new Date().toISOString();
    localStorage.setItem('logisticaId', sesionId);
    localStorage.setItem('logisticaNombre', data.nombre);
    localStorage.setItem('logisticaInicio', ahora);
    gastos = [];
    activarPanel(data.nombre, ahora);
    arrancarGPS();
    arrancarTimer(ahora);
  } catch(e) {
    mostrarError('err-inicio', 'No se pudo conectar.');
  }
}

// ── TIPO GASTO ──
function onTipoGasto() {
  const tipo = document.getElementById('gasto-tipo').value;
  document.getElementById('gasto-desc').value = tipo;
  const rowKm = document.getElementById('row-km');
  if (tipo === 'Combustible') {
    rowKm.classList.add('visible');
    document.getElementById('gasto-km').setAttribute('required', 'required');
  } else {
    rowKm.classList.remove('visible');
    document.getElementById('gasto-km').removeAttribute('required');
    document.getElementById('gasto-km').value = '';
  }
}

// ── TIMER ──
function arrancarTimer(isoInicio) {
  inicioTS = new Date(isoInicio).getTime();
  actualizarTimer();
  if (intervalTimer) clearInterval(intervalTimer);
  intervalTimer = setInterval(actualizarTimer, 1000);
}
function actualizarTimer() {
  const diff = Math.floor((Date.now() - inicioTS) / 1000);
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  const s = diff % 60;
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('txt-timer').textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
}

// ── FINALIZAR ──
async function finalizar() {
  if (!confirm('¿Finalizar el turno de logística?')) return;
  try { await fetch(API + '/logistica/' + sesionId + '/finalizar', { method: 'POST' }); } catch(e) {}
  detenerGPS();
  if (intervalTimer) { clearInterval(intervalTimer); intervalTimer = null; }
  sesionId = null; inicioTS = null;
  localStorage.removeItem('logisticaId');
  localStorage.removeItem('logisticaNombre');
  localStorage.removeItem('logisticaInicio');
  document.getElementById('panel-activo').classList.add('hidden');
  document.getElementById('panel-inicio').classList.remove('hidden');
}

// ── GPS (silencioso — solo envía datos al servidor, no muestra mapa) ──
var _ultimoEnvioGPS = 0;
function arrancarGPS() {
  if (!navigator.geolocation) return;
  enviarGPS();
  intervalGPS = setInterval(enviarGPS, 20 * 60 * 1000); // cada 20 minutos
}
function detenerGPS() {
  if (intervalGPS) { clearInterval(intervalGPS); intervalGPS = null; }
}
function enviarGPS() {
  if (!sesionId) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    try {
      await fetch(API + '/logistica/' + sesionId + '/ubicacion', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lat, lng })
      });
    } catch(e) {}
  }, () => {}, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}

// ── GASTOS ──
function previewFoto() {
  const file = document.getElementById('gasto-foto').files[0];
  if (!file) return;
  document.getElementById('txt-foto').textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('preview-foto');
    img.src = e.target.result;
    img.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

async function registrarGasto() {
  const tipo  = document.getElementById('gasto-tipo').value;
  const desc  = document.getElementById('gasto-desc').value.trim();
  const monto = parseFloat(document.getElementById('gasto-monto').value);
  const km    = document.getElementById('gasto-km').value;

  if (!desc) { mostrarError('err-gasto', 'Elegí un tipo de gasto.'); return; }
  if (!monto || monto <= 0) { mostrarError('err-gasto', 'Ingresá un monto válido.'); return; }
  if (tipo === 'Combustible' && !km) { mostrarError('err-gasto', 'Ingresá los KM del vehículo.'); return; }

  let foto_url = null;
  const fotoFile = document.getElementById('gasto-foto').files[0];
  if (fotoFile) {
    foto_url = await new Promise(resolve => {
      const r = new FileReader();
      r.onload = e => resolve(e.target.result);
      r.readAsDataURL(fotoFile);
    });
  }

  const payload = { descripcion: desc, monto, foto_url };
  if (km) payload.km_vehiculo = parseInt(km);

  try {
    await fetch(API + '/logistica/' + sesionId + '/gasto', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    gastos.push({ descripcion: desc, monto, foto_url, km_vehiculo: km || null });
    renderGastos();
    // Limpiar formulario
    document.getElementById('gasto-tipo').value = '';
    document.getElementById('gasto-desc').value = '';
    document.getElementById('gasto-km').value = '';
    document.getElementById('gasto-monto').value = '';
    document.getElementById('gasto-foto').value = '';
    document.getElementById('txt-foto').textContent = 'Sin foto';
    document.getElementById('preview-foto').classList.add('hidden');
    document.getElementById('row-km').classList.remove('visible');
    document.getElementById('err-gasto').classList.add('hidden');
  } catch(e) { mostrarError('err-gasto', 'No se pudo guardar.'); }
}

function renderGastos() {
  const lista = document.getElementById('lista-gastos');
  if (!gastos.length) {
    lista.innerHTML = '<p class="text-gray-700 text-xs text-center py-2">Sin gastos registrados.</p>';
    document.getElementById('txt-total').textContent = '$ 0 a rendir';
    return;
  }
  let total = 0;
  lista.innerHTML = gastos.map(g => {
    total += g.monto;
    const kmBadge = g.km_vehiculo ? `<span class="text-blue-400 text-xs ml-1">📏 ${parseInt(g.km_vehiculo).toLocaleString('es-AR')} km</span>` : '';
    const fotoBadge = g.foto_url ? '<span class="text-gray-500 text-xs ml-1">📷</span>' : '';
    return `<div class="bg-gray-900 border border-gray-800 rounded-lg px-3 py-2 flex justify-between items-center">
      <div>
        <p class="text-white text-sm font-bold">${g.descripcion}${fotoBadge}</p>
        ${kmBadge ? `<p class="mt-0.5">${kmBadge}</p>` : ''}
      </div>
      <p class="text-green-400 font-black text-sm whitespace-nowrap ml-2">+ $ ${parseFloat(g.monto).toLocaleString('es-AR')}</p>
    </div>`;
  }).join('');
  document.getElementById('txt-total').textContent = '$ ' + total.toLocaleString('es-AR') + ' a rendir';
}

function activarPanel(nombre, inicio) {
  document.getElementById('panel-inicio').classList.add('hidden');
  document.getElementById('panel-activo').classList.remove('hidden');
  document.getElementById('txt-nombre').textContent = nombre;
  document.getElementById('txt-inicio').textContent = 'Inicio: ' + new Date(inicio).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  renderGastos();
}

function mostrarError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 4000);
}

// Restaurar sesión si quedó activa
(function() {
  const id = localStorage.getItem('logisticaId');
  const nombre = localStorage.getItem('logisticaNombre');
  const inicio = localStorage.getItem('logisticaInicio');
  if (id && nombre) {
    sesionId = parseInt(id);
    activarPanel(nombre, inicio);
    arrancarGPS();
    arrancarTimer(inicio);
  }
})();
</script>
</body>
</html>
