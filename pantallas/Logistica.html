<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Logística – Portal del Viento</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0a0a0a; color:#fff; font-family:system-ui,sans-serif; -webkit-tap-highlight-color:transparent; }
  .neon { color:#e4fc74; }
  .pulse { animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
  input,textarea,select { background:#111; border:1px solid #333; color:#fff; border-radius:0.75rem; padding:0.75rem 1rem; width:100%; font-size:1rem; }
  input:focus,textarea:focus { outline:none; border-color:#e4fc74; }
  .btn { display:block; width:100%; padding:1.2rem; border-radius:1rem; font-size:1.1rem; font-weight:800; text-align:center; border:none; cursor:pointer; transition:opacity .15s,transform .1s; }
  .btn:active { transform:scale(.97); opacity:.85; }
  .btn-verde { background:#22c55e; color:#000; }
  .btn-rojo  { background:#ef4444; color:#fff; }
  .btn-neon  { background:#e4fc74; color:#000; }
  .btn-gris  { background:#1f2937; color:#9ca3af; border:1px solid #374151; }
</style>
</head>
<body class="min-h-screen p-5 pb-10">

<div class="max-w-sm mx-auto">
  <div class="text-center mb-6">
    <p class="text-gray-600 text-xs uppercase tracking-widest mb-1">Portal del Viento</p>
    <h1 class="text-2xl font-black text-white">Logística</h1>
  </div>

  <!-- ── PANEL INICIO ── -->
  <div id="panel-inicio">
    <p class="text-gray-500 text-sm text-center mb-5">Ingresá tu nombre para comenzar el turno.</p>
    <input id="inp-nombre" type="text" placeholder="Tu nombre" autocomplete="off" class="mb-4">
    <button class="btn btn-verde" onclick="iniciar()">🚗 Iniciar logística</button>
    <div id="err-inicio" class="text-red-400 text-sm text-center mt-3 hidden"></div>
  </div>

  <!-- ── PANEL ACTIVO ── -->
  <div id="panel-activo" class="hidden">

    <!-- Estado -->
    <div class="bg-green-950 border border-green-800 rounded-2xl p-4 mb-4 flex items-center gap-3">
      <span class="w-3 h-3 bg-green-400 rounded-full pulse flex-shrink-0"></span>
      <div>
        <p class="text-green-400 font-black text-sm uppercase tracking-widest">En logística</p>
        <p id="txt-nombre" class="text-white font-bold text-lg leading-tight"></p>
        <p id="txt-inicio" class="text-gray-500 text-xs"></p>
      </div>
    </div>

    <!-- GPS -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-3 mb-4">
      <p class="text-gray-600 text-xs uppercase font-bold mb-1">📍 GPS</p>
      <p id="txt-gps" class="text-white text-sm">Obteniendo ubicación...</p>
      <p id="txt-gps-hora" class="text-gray-600 text-xs mt-0.5"></p>
    </div>

    <!-- Gastos registrados -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <p class="text-gray-500 text-xs uppercase font-bold">💸 Gastos del turno</p>
        <p id="txt-total" class="neon font-black text-sm">$ 0</p>
      </div>
      <div id="lista-gastos" class="space-y-2"></div>
    </div>

    <!-- Formulario nuevo gasto -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 mb-4">
      <p class="text-gray-400 text-sm font-bold mb-3">+ Registrar gasto</p>
      <input id="gasto-desc" type="text" placeholder="Descripción (ej: Nafta, Peaje)" class="mb-3">
      <input id="gasto-monto" type="number" placeholder="Monto $" min="1" step="1" class="mb-3">

      <!-- Foto del ticket -->
      <label class="flex items-center gap-2 text-gray-400 text-sm mb-3 cursor-pointer">
        <span class="bg-gray-800 border border-gray-700 px-3 py-2 rounded-lg text-xs font-bold hover:border-gray-500">📷 Foto del ticket</span>
        <span id="txt-foto" class="text-gray-600 text-xs">Sin foto</span>
        <input type="file" id="gasto-foto" accept="image/*" capture="environment" class="hidden" onchange="previewFoto()">
      </label>
      <img id="preview-foto" class="hidden w-full rounded-lg mb-3 max-h-40 object-cover">

      <button class="btn btn-neon" onclick="registrarGasto()">Guardar gasto</button>
      <div id="err-gasto" class="text-red-400 text-sm text-center mt-2 hidden"></div>
    </div>

    <!-- Finalizar -->
    <button class="btn btn-rojo" onclick="finalizar()">🏁 Finalizar logística</button>
  </div>
</div>

<script>
const API = window.location.origin + '/api';
let sesionId = null;
let intervalGPS = null;
let gastos = [];

function fmtHora(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
}
function fmtMonto(n) {
  return '$ ' + parseFloat(n).toLocaleString('es-AR', { minimumFractionDigits:0 });
}
function mostrarError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 4000);
}

// ── INICIAR ──
async function iniciar() {
  const nombre = document.getElementById('inp-nombre').value.trim();
  if (!nombre) { mostrarError('err-inicio', 'Ingresá tu nombre.'); return; }
  try {
    const res = await fetch(API + '/logistica/iniciar', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ repartidor: nombre })
    }).then(r => r.json());
    sesionId = res.id;
    localStorage.setItem('logisticaId', sesionId);
    localStorage.setItem('logisticaNombre', nombre);
    localStorage.setItem('logisticaInicio', new Date().toISOString());
    gastos = [];
    activarPanel(nombre, new Date().toISOString());
    arrancarGPS();
  } catch(e) { mostrarError('err-inicio', 'No se pudo conectar.'); }
}

// ── FINALIZAR ──
async function finalizar() {
  if (!confirm('¿Finalizar el turno de logística?')) return;
  try { await fetch(API + '/logistica/' + sesionId + '/finalizar', { method:'POST' }); } catch(e) {}
  detenerGPS();
  sesionId = null;
  localStorage.removeItem('logisticaId');
  localStorage.removeItem('logisticaNombre');
  localStorage.removeItem('logisticaInicio');
  document.getElementById('panel-activo').classList.add('hidden');
  document.getElementById('panel-inicio').classList.remove('hidden');
  document.getElementById('inp-nombre').value = '';
}

// ── GPS ──
function arrancarGPS() {
  if (!navigator.geolocation) return;
  enviarGPS();
  intervalGPS = setInterval(enviarGPS, 15000);
}
function detenerGPS() {
  if (intervalGPS) { clearInterval(intervalGPS); intervalGPS = null; }
}
function enviarGPS() {
  if (!sesionId) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    document.getElementById('txt-gps').textContent = lat.toFixed(5) + ', ' + lng.toFixed(5);
    document.getElementById('txt-gps-hora').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-AR');
    try {
      await fetch(API + '/logistica/' + sesionId + '/ubicacion', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ lat, lng })
      });
    } catch(e) {}
  }, () => {
    document.getElementById('txt-gps').textContent = 'No se pudo obtener GPS';
  }, { enableHighAccuracy:true, timeout:10000 });
}

// ── GASTOS ──
function previewFoto() {
  const file = document.getElementById('gasto-foto').files[0];
  if (!file) return;
  document.getElementById('txt-foto').textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('preview-foto');
    img.src = e.target.result;
    img.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

async function registrarGasto() {
  const desc = document.getElementById('gasto-desc').value.trim();
  const monto = parseFloat(document.getElementById('gasto-monto').value);
  if (!desc) { mostrarError('err-gasto', 'Ingresá una descripción.'); return; }
  if (!monto || monto <= 0) { mostrarError('err-gasto', 'Ingresá un monto válido.'); return; }

  let foto_url = null;
  const fotoFile = document.getElementById('gasto-foto').files[0];
  if (fotoFile) {
    // Subir foto como base64 en el campo foto_url (simplificado)
    foto_url = await new Promise(resolve => {
      const r = new FileReader();
      r.onload = e => resolve(e.target.result);
      r.readAsDataURL(fotoFile);
    });
  }

  try {
    await fetch(API + '/logistica/' + sesionId + '/gasto', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ descripcion: desc, monto, foto_url })
    });
    gastos.push({ descripcion: desc, monto, foto_url });
    renderGastos();
    // Limpiar
    document.getElementById('gasto-desc').value = '';
    document.getElementById('gasto-monto').value = '';
    document.getElementById('gasto-foto').value = '';
    document.getElementById('txt-foto').textContent = 'Sin foto';
    document.getElementById('preview-foto').classList.add('hidden');
  } catch(e) { mostrarError('err-gasto', 'No se pudo guardar.'); }
}

function renderGastos() {
  const lista = document.getElementById('lista-gastos');
  if (!gastos.length) {
    lista.innerHTML = '<p class="text-gray-700 text-xs text-center py-2">Sin gastos registrados.</p>';
    document.getElementById('txt-total').textContent = '$ 0';
    return;
  }
  let total = 0;
  lista.innerHTML = gastos.map((g, i) => {
    total += g.monto;
    return `<div class="bg-gray-900 border border-gray-800 rounded-lg px-3 py-2 flex justify-between items-center">
      <div>
        <p class="text-white text-sm font-bold">${g.descripcion}</p>
        ${g.foto_url ? '<p class="text-gray-600 text-xs">📷 Con foto</p>' : ''}
      </div>
      <p class="text-red-400 font-black">${fmtMonto(g.monto)}</p>
    </div>`;
  }).join('');
  document.getElementById('txt-total').textContent = fmtMonto(total);
}

function activarPanel(nombre, inicio) {
  document.getElementById('panel-inicio').classList.add('hidden');
  document.getElementById('panel-activo').classList.remove('hidden');
  document.getElementById('txt-nombre').textContent = nombre;
  document.getElementById('txt-inicio').textContent = 'Inicio: ' + fmtHora(inicio);
  renderGastos();
}

// Restaurar sesión si quedó activa
(function() {
  const id = localStorage.getItem('logisticaId');
  const nombre = localStorage.getItem('logisticaNombre');
  const inicio = localStorage.getItem('logisticaInicio');
  if (id && nombre) {
    sesionId = parseInt(id);
    activarPanel(nombre, inicio);
    arrancarGPS();
  }
})();
</script>
</body>
</html>
